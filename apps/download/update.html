<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Appnetick - Update Manager</title>

<link rel="icon" href="/20260313_121958.jpg">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#0b141a;
    color:#fff;
}

.toolbar{
    position:sticky;
    top:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px 16px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(255,255,255,0.1);

    z-index:1000;
}

.toolbar .title{
    font-weight:700;
    font-size:18px;
}

.toolbar img{
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
}

.container{
    padding:25px;
    max-width:400px;
    margin:auto;
}

.heading{
    font-size:26px;
    font-weight:700;
    margin-top:20px;
}

.desc{
    color:#aaa;
    margin-top:8px;
    font-size:14px;
    line-height:1.5;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin-top:18px;

    border:none;
    border-radius:12px;

    background:#1f2c33;
    color:#fff;

    outline:none;
    font-size:14px;
}

textarea{
    min-height:110px;
    resize:vertical;
}

input::placeholder,
textarea::placeholder{
    color:#89949a;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;

    border:none;
    border-radius:35px;

    background:#2196f3;
    color:#fff;

    font-weight:700;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.section{
    margin-top:28px;
    font-size:17px;
    font-weight:700;
}

.force-row{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:18px;
    padding:14px;

    border-radius:12px;
    background:#1f2c33;
}

.force-text{
    font-size:14px;
}

.switch-control{
    position:relative;
    width:48px;
    height:27px;
}

.switch-control input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;

    background:#45545c;

    border-radius:30px;
    cursor:pointer;

    transition:.2s;
}

.slider:before{
    content:"";

    position:absolute;

    width:21px;
    height:21px;

    left:3px;
    top:3px;

    background:#fff;

    border-radius:50%;

    transition:.2s;
}

.switch-control input:checked + .slider{
    background:#2196f3;
}

.switch-control input:checked + .slider:before{
    transform:translateX(21px);
}

.status{
    display:none;

    margin-top:18px;
    padding:13px;

    border-radius:12px;

    font-size:13px;
    line-height:1.4;
}

.success{
    display:block;
    background:#12351f;
    color:#6ee78a;
}

.error{
    display:block;
    background:#351719;
    color:#ff7777;
}

.footer{
    margin-top:40px;
    padding-bottom:20px;

    width:100%;
    text-align:center;

    font-size:14px;
}

</style>

</head>

<body>


<!-- TOOLBAR -->

<div class="toolbar">

    <div class="title">
        Appnetick
    </div>

    <img
        src="/20260313_121958.jpg"
        onclick="location.href='/index.html'"
    >

</div>


<!-- MAIN -->

<div class="container">

    <div class="heading">
        Update Appnetick
    </div>

    <div class="desc">
        Publish a new APK update for Appnetick users.
    </div>


    <!-- SECRET KEY -->

    <input
        id="secretKey"
        type="password"
        placeholder="Admin secret key"
        autocomplete="off"
    >


    <!-- VERSION -->

    <div class="section">
        Version
    </div>

    <input
        id="versionCode"
        type="number"
        min="1"
        placeholder="Version Code e.g. 16"
    >

    <input
        id="versionName"
        type="text"
        placeholder="Version Name e.g. 1.6.0"
    >


    <!-- APK -->

    <div class="section">
        APK
    </div>

    <input
        id="apkUrl"
        type="url"
        placeholder="APK download URL"
    >


    <!-- MESSAGE -->

    <div class="section">
        Update Message
    </div>

    <textarea
        id="message"
        placeholder="What's new in this update?"
    ></textarea>


    <!-- FORCE UPDATE -->

    <div class="force-row">

        <div class="force-text">
            Force Update
        </div>

        <label class="switch-control">

            <input
                id="forceUpdate"
                type="checkbox"
            >

            <span class="slider"></span>

        </label>

    </div>


    <!-- PUBLISH -->

    <button
        id="publishButton"
        onclick="publishUpdate()"
    >
        Publish Update
    </button>


    <div
        id="status"
        class="status"
    ></div>

</div>


<div class="footer">
    Appnetick Update Manager
</div>


<script>

async function publishUpdate(){

    const secretKey =
        document.getElementById(
            "secretKey"
        ).value.trim();


    const versionCode =
        document.getElementById(
            "versionCode"
        ).value.trim();


    const versionName =
        document.getElementById(
            "versionName"
        ).value.trim();


    const apkUrl =
        document.getElementById(
            "apkUrl"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        ).value.trim();


    const forceUpdate =
        document.getElementById(
            "forceUpdate"
        ).checked;


    if(!secretKey){

        showStatus(
            "Admin secret key required.",
            false
        );

        return;
    }


    if(!versionCode){

        showStatus(
            "Version Code required.",
            false
        );

        return;
    }


    if(!versionName){

        showStatus(
            "Version Name required.",
            false
        );

        return;
    }


    if(!apkUrl){

        showStatus(
            "APK URL required.",
            false
        );

        return;
    }


    if(
        !apkUrl.startsWith("https://") &&
        !apkUrl.startsWith("http://")
    ){

        showStatus(
            "Enter a valid APK URL.",
            false
        );

        return;
    }


    const button =
        document.getElementById(
            "publishButton"
        );


    button.disabled = true;
    button.textContent = "Publishing...";


    try{

        const response =
            await fetch(
                "/api/update",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        secretKey:
                            secretKey,

                        versionCode:
                            Number(versionCode),

                        versionName:
                            versionName,

                        apkUrl:
                            apkUrl,

                        message:
                            message ||
                            "A new version of Appnetick is available.",

                        forceUpdate:
                            forceUpdate

                    })
                }
            );


        const result =
            await response.json();


        if(!response.ok){

            throw new Error(
                result.error ||
                "Update failed."
            );

        }


        showStatus(
            "Update published successfully.",
            true
        );


    }catch(error){

        console.error(error);

        showStatus(
            error.message ||
            "Unable to publish update.",
            false
        );

    }


    button.disabled = false;
    button.textContent = "Publish Update";

}



function showStatus(
    text,
    success
){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent = text;


    status.className =
        success
            ? "status success"
            : "status error";

}

</script>

</body>

</html>
