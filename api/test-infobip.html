<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Infobip Token Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: 40px auto;
}

.card {
    background: #1e1e1e;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
}

h2 {
    margin: 0 0 8px;
    font-size: 22px;
}

.subtitle {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 22px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-size: 13px;
    color: #bbb;
}

input {
    width: 100%;
    height: 48px;
    border: 1px solid #3a3a3a;
    outline: none;
    border-radius: 12px;
    background: #292929;
    color: #fff;
    padding: 0 14px;
    font-size: 15px;
}

input:focus {
    border-color: #2979ff;
}

button {
    width: 100%;
    height: 48px;
    margin-top: 20px;
    border: 0;
    border-radius: 12px;
    background: #2979ff;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.status {
    margin-top: 18px;
    padding: 14px;
    border-radius: 12px;
    background: #292929;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
}

pre {
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
    font-family: monospace;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Infobip Token Test</h2>

        <div class="subtitle">
            Test your Vercel Infobip token API
        </div>

        <label>Identity</label>
        <input
            id="identity"
            type="text"
            value="test_user_001"
            maxlength="64"
            autocomplete="off"
        >

        <label>Display Name</label>
        <input
            id="displayName"
            type="text"
            value="Test User"
            maxlength="100"
            autocomplete="off"
        >

        <button id="testButton" onclick="testToken()">
            Generate Infobip Token
        </button>

        <div class="status">
            <pre id="result">Ready...</pre>
        </div>

    </div>

</div>

<script>

async function testToken() {

    const button = document.getElementById("testButton");
    const result = document.getElementById("result");

    const identity =
        document.getElementById("identity").value.trim();

    const displayName =
        document.getElementById("displayName").value.trim();

    if (!identity) {
        result.textContent = "❌ Identity is required.";
        return;
    }

    if (!/^[A-Za-z0-9_-]{1,64}$/.test(identity)) {
        result.textContent =
            "❌ Invalid identity.\n\nUse only A-Z, a-z, 0-9, _ and -";
        return;
    }

    button.disabled = true;
    button.textContent = "Testing...";

    result.textContent =
        "Sending POST request to Vercel...\n\nPlease wait.";

    try {

        const response = await fetch(
            "https://appnetick-link.vercel.app/api/infobip-token",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify({
                    identity: identity,
                    displayName: displayName || identity
                })
            }
        );

        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            data = {
                rawResponse: text
            };
        }

        result.textContent =
            "HTTP STATUS: " + response.status +
            "\n\n" +
            JSON.stringify(data, null, 2);

        if (response.ok && data.success && data.token) {

            result.textContent =
                "✅ TOKEN GENERATED SUCCESSFULLY\n\n" +
                "HTTP STATUS: " + response.status +
                "\n\n" +
                JSON.stringify(data, null, 2);

        } else {

            result.textContent =
                "❌ TOKEN GENERATION FAILED\n\n" +
                "HTTP STATUS: " + response.status +
                "\n\n" +
                JSON.stringify(data, null, 2);
        }

    } catch (error) {

        result.textContent =
            "❌ REQUEST ERROR\n\n" +
            error.message;

    } finally {

        button.disabled = false;
        button.textContent = "Generate Infobip Token";
    }
}

</script>

</body>
</html>
