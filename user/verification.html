<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appnetick Verification</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --blue: #2979ff;
    --blue-soft: #eaf2ff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f7f8fa;
    --card: #ffffff;
    --danger: #dc2626;
    --success: #16a34a;
    --radius: 16px;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

/* ================= TOOLBAR ================= */

.toolbar {
    height: 64px;
    background: rgba(255,255,255,.94);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(12px);
}

.toolbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand {
    font-size: 17px;
    font-weight: 700;
    margin-right: 8px;
}

.back-btn {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-size: 21px;
}

.back-btn:hover {
    background: #f1f3f5;
}

.back-btn.hidden {
    visibility: hidden;
}

/* progress next to back button */

.toolbar-progress {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 150px;
}

.progress-number {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
}

.toolbar-progress-track {
    width: 90px;
    height: 5px;
    background: #e9edf3;
    border-radius: 99px;
    overflow: hidden;
}

.toolbar-progress-fill {
    height: 100%;
    width: 0;
    background: var(--blue);
    border-radius: inherit;
    transition: width .25s ease;
}

.toolbar-right {
    margin-left: auto;
    display: flex;
    gap: 7px;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border: 0;
    background: transparent;
    border-radius: 10px;
    font-size: 18px;
}

.icon-btn:hover {
    background: #f1f3f5;
}

/* ================= PAGE ================= */

.page {
    width: min(680px, calc(100% - 32px));
    margin: 0 auto;
    padding: 42px 0 100px;
}

.step-header {
    margin-bottom: 26px;
}

.step-title {
    margin: 0;
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: -.5px;
}

.step-description {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
}

/* ================= FIELDS ================= */

.field {
    margin-bottom: 22px;
}

.field-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 9px;
}

.input,
.textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 13px;
    padding: 14px 15px;
    outline: none;
    transition: .2s;
}

.input {
    height: 50px;
}

.textarea {
    min-height: 130px;
    resize: vertical;
}

.input:focus,
.textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(41,121,255,.10);
}

.optional {
    color: #9ca3af;
    font-weight: 400;
}

/* ================= RADIO CARDS ================= */

.option-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.option-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 13px;
    min-height: 66px;
    padding: 13px 15px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: border-color .18s, background .18s, box-shadow .18s;
    cursor: pointer;
}

.option-card:hover {
    border-color: #b9c7dc;
}

.option-card.selected {
    border-color: var(--blue);
    background: var(--blue-soft);
    box-shadow: 0 0 0 1px var(--blue);
}

.option-card input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.option-indicator {
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
    border: 2px solid #c8ced8;
    display: flex;
    align-items: center;
    justify-content: center;
}

.radio .option-indicator {
    border-radius: 50%;
}

.radio .option-card.selected .option-indicator {
    border-color: var(--blue);
}

.radio .option-card.selected .option-indicator::after {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--blue);
}

.checkbox .option-indicator {
    border-radius: 6px;
}

.checkbox .option-card.selected .option-indicator {
    background: var(--blue);
    border-color: var(--blue);
}

.checkbox .option-card.selected .option-indicator::after {
    content: "✓";
    color: white;
    font-size: 13px;
    font-weight: 700;
}

.option-content {
    min-width: 0;
}

.option-title {
    display: block;
    font-size: 14px;
    font-weight: 600;
}

.option-description {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
    line-height: 1.4;
}

/* ================= CHIPS ================= */

.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.chip {
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    padding: 11px 15px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    transition: .18s;
}

.chip:hover {
    border-color: #b9c7dc;
}

.chip.selected {
    background: var(--blue-soft);
    border-color: var(--blue);
    color: #1459c7;
}

/* ================= ERROR ================= */

.error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
}

/* ================= BOTTOM BUTTON ================= */

.bottom-actions {
    margin-top: 32px;
}

.primary-btn {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 13px;
    background: var(--blue);
    color: white;
    font-weight: 600;
    transition: .2s;
}

.primary-btn:hover {
    filter: brightness(.95);
}

.primary-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* ================= REVIEW ================= */

.review {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.review-row {
    background: white;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 14px;
}

.review-label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
}

.review-value {
    font-size: 14px;
    font-weight: 500;
    word-break: break-word;
}

/* ================= SUCCESS ================= */

.success {
    text-align: center;
    padding: 60px 0;
}

.success-icon {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: #dcfce7;
    color: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin: 0 auto 20px;
}

.success h1 {
    margin: 0;
    font-size: 28px;
}

.success p {
    color: var(--muted);
    line-height: 1.6;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .toolbar {
        padding: 0 12px;
    }

    .brand {
        display: none;
    }

    .toolbar-progress {
        min-width: 0;
    }

    .toolbar-progress-track {
        width: 65px;
    }

    .page {
        width: min(100% - 24px, 680px);
        padding-top: 28px;
    }

    .step-title {
        font-size: 26px;
    }

    .option-card {
        min-height: 62px;
    }
}
</style>
</head>

<body>

<header class="toolbar">

    <div class="toolbar-left">

        <button
            class="back-btn hidden"
            id="backBtn"
            onclick="previousStep()"
            aria-label="Back">
            ←
        </button>

        <div class="brand">Appnetick</div>

        <div class="toolbar-progress">
            <span class="progress-number" id="progressNumber">
                1 / 21
            </span>

            <div class="toolbar-progress-track">
                <div
                    class="toolbar-progress-fill"
                    id="progressFill">
                </div>
            </div>
        </div>

    </div>

    <div class="toolbar-right">

        <button
            class="icon-btn"
            onclick="toggleTheme()"
            aria-label="Theme">
            ◐
        </button>

        <button
            class="icon-btn"
            onclick="goHome()"
            aria-label="Home">
            ⌂
        </button>

    </div>

</header>


<main class="page">

    <div class="step-header">
        <h1 class="step-title" id="stepTitle"></h1>
        <p class="step-description" id="stepDescription"></p>
    </div>

    <div id="stepContent"></div>

    <div class="bottom-actions">
        <button
            class="primary-btn"
            id="continueBtn"
            onclick="nextStep()">
            Continue
        </button>
    </div>

</main>


<script>

const API_BASE = "https://api-appnetick.vercel.app";


/*
|--------------------------------------------------------------------------
| FORM DATA
|--------------------------------------------------------------------------
*/

const formData = {

    username: "",

    legalName: "",

    dateOfBirth: "",

    country: "",

    phone: "",

    accountCategory: "",

    profession: "",

    verificationReason: "",

    knownFor: "",

    website: "",

    socialProfile: "",

    audience: [],

    contentCategory: [],

    achievement: "",

    publicPresence: [],

    authenticityConfirmed: false,

    informationConfirmed: false,

    termsConfirmed: false,

    email: ""

};


/*
|--------------------------------------------------------------------------
| STEP DEFINITIONS
|--------------------------------------------------------------------------
|
| type:
|
| text
| date
| textarea
| radio       = one selection
| checkbox    = multiple selections
| chips       = multiple selections
|
*/

const steps = [

    {
        type: "intro",
        title: "Request verification",
        description:
            "Tell us about yourself and your public presence. This application only takes a few minutes."
    },

    {
        type: "text",
        key: "username",
        title: "What is your username?",
        description:
            "Enter the username of the account you want to verify.",
        placeholder: "@username",
        required: true
    },

    {
        type: "text",
        key: "legalName",
        title: "What is your legal name?",
        description:
            "Use the name shown on your identification document.",
        placeholder: "Full legal name",
        required: true
    },

    {
        type: "date",
        key: "dateOfBirth",
        title: "What is your date of birth?",
        description:
            "This information is used for verification purposes.",
        required: true
    },

    /*
     * RADIO
     */

    {
        type: "radio",
        key: "country",
        title: "Where are you based?",
        description:
            "Select one country.",
        required: true,

        options: [
            "India",
            "United States",
            "United Kingdom",
            "Canada",
            "Australia",
            "United Arab Emirates",
            "Singapore",
            "Other"
        ]
    },

    {
        type: "text",
        key: "phone",
        title: "What is your phone number?",
        description:
            "Add a phone number where we can contact you if required.",
        placeholder: "+91 98765 43210",
        required: true
    },

    /*
     * RADIO
     */

    {
        type: "radio",
        key: "accountCategory",
        title: "What type of account is this?",
        description:
            "Select the category that best describes your account.",
        required: true,

        options: [
            {
                title: "Creator",
                description: "Individual creator or public personality",
                value: "creator"
            },
            {
                title: "Business",
                description: "Company, brand or commercial account",
                value: "business"
            },
            {
                title: "Organization",
                description: "Organization, institution or community",
                value: "organization"
            },
            {
                title: "Public Figure",
                description: "Recognized public-facing individual",
                value: "public_figure"
            },
            {
                title: "Media",
                description: "News, publication or media account",
                value: "media"
            }
        ]
    },

    {
        type: "text",
        key: "profession",
        title: "What do you do?",
        description:
            "Tell us your primary profession or role.",
        placeholder: "e.g. Entrepreneur, Artist, Developer",
        required: true
    },

    {
        type: "textarea",
        key: "verificationReason",
        title: "Why should this account be verified?",
        description:
            "Explain why verification is important for your account.",
        placeholder:
            "Tell us why you believe your account should be verified.",
        required: true
    },

    {
        type: "textarea",
        key: "knownFor",
        title: "What are you known for?",
        description:
            "Briefly describe your public work or recognition.",
        placeholder:
            "Describe your work, achievements or public recognition.",
        required: true
    },

    {
        type: "text",
        key: "website",
        title: "Do you have an official website?",
        description:
            "This helps us establish your public presence.",
        placeholder: "https://example.com",
        required: false
    },

    {
        type: "text",
        key: "socialProfile",
        title: "Add another public profile",
        description:
            "Provide another social or public profile connected to you.",
        placeholder: "https://...",
        required: true
    },

    /*
     * CHIPS - MULTIPLE
     */

    {
        type: "chips",
        key: "audience",
        title: "Who is your audience?",
        description:
            "Select all audiences that apply.",
        required: true,

        options: [
            "General public",
            "Fans",
            "Professionals",
            "Businesses",
            "Students",
            "Creators",
            "Customers",
            "Community"
        ]
    },

    /*
     * CHECKBOX CARDS - MULTIPLE
     */

    {
        type: "checkbox",
        key: "contentCategory",
        title: "What type of content do you create?",
        description:
            "Select all categories that describe your content.",
        required: true,

        options: [
            {
                title: "Entertainment",
                description: "Entertainment, comedy or lifestyle",
                value: "entertainment"
            },
            {
                title: "Education",
                description: "Educational or informational content",
                value: "education"
            },
            {
                title: "Business",
                description: "Business, entrepreneurship or finance",
                value: "business"
            },
            {
                title: "Technology",
                description: "Technology, software or innovation",
                value: "technology"
            },
            {
                title: "News & Media",
                description: "News, journalism or media",
                value: "news_media"
            },
            {
                title: "Arts & Culture",
                description: "Art, music, culture or creative work",
                value: "arts_culture"
            },
            {
                title: "Sports",
                description: "Sports, fitness or athletics",
                value: "sports"
            },
            {
                title: "Other",
                description: "Another type of public content",
                value: "other"
            }
        ]
    },

    {
        type: "textarea",
        key: "achievement",
        title: "What are your main achievements?",
        description:
            "Mention awards, publications, milestones or other notable achievements.",
        placeholder:
            "List your most relevant achievements.",
        required: true
    },

    /*
     * CHIPS - MULTIPLE
     */

    {
        type: "chips",
        key: "publicPresence",
        title: "Where have you been publicly featured?",
        description:
            "Select all that apply.",
        required: true,

        options: [
            "News",
            "Magazines",
            "Television",
            "Podcasts",
            "YouTube",
            "Events",
            "Publications",
            "Interviews",
            "None"
        ]
    },

    /*
     * CHECKBOX
     */

    {
        type: "singleCheckbox",
        key: "authenticityConfirmed",
        title: "Confirm account authenticity",
        description:
            "Confirm that this account represents you, your organization or the entity you claim to represent.",
        required: true
    },

    {
        type: "singleCheckbox",
        key: "informationConfirmed",
        title: "Confirm your information",
        description:
            "Confirm that the information provided in this application is accurate and complete.",
        required: true
    },

    {
        type: "singleCheckbox",
        key: "termsConfirmed",
        title: "Accept verification terms",
        description:
            "Confirm that you understand the verification application process and agree to the applicable terms.",
        required: true
    },

    {
        type: "text",
        key: "email",
        title: "Where should we send the verification update?",
        description:
            "A confirmation email must be successfully sent to this address before the application is shown as submitted.",
        placeholder: "you@example.com",
        required: true,
        email: true
    },

    {
        type: "review",
        title: "Review your application",
        description:
            "Check your information before submitting the verification application."
    }

];


let currentStep = 0;
let isSubmitting = false;


/*
|--------------------------------------------------------------------------
| HELPERS
|--------------------------------------------------------------------------
*/

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getOptionValue(option) {

    if (typeof option === "string") {
        return option;
    }

    return option.value;
}


function getOptionTitle(option) {

    if (typeof option === "string") {
        return option;
    }

    return option.title;
}


function getOptionDescription(option) {

    if (typeof option === "string") {
        return "";
    }

    return option.description || "";
}


/*
|--------------------------------------------------------------------------
| RENDER
|--------------------------------------------------------------------------
*/

function renderStep() {

    const step = steps[currentStep];

    document.getElementById("stepTitle").textContent =
        step.title || "";

    document.getElementById("stepDescription").textContent =
        step.description || "";

    document.getElementById("stepContent").innerHTML =
        getStepHTML(step);

    updateProgress();

    updateToolbar();

    updateButton();

    restoreSelections();

}


/*
|--------------------------------------------------------------------------
| STEP HTML
|--------------------------------------------------------------------------
*/

function getStepHTML(step) {

    if (step.type === "intro") {

        return `
            <div class="field">
                <p>
                    Complete the questions below. Most questions use
                    selections so the application can be completed quickly.
                </p>
            </div>
        `;
    }


    if (
        step.type === "text" ||
        step.type === "date"
    ) {

        return `
            <div class="field">

                <label class="field-label">
                    ${escapeHTML(step.title)}
                    ${
                        step.required
                            ? ""
                            : `<span class="optional"> (optional)</span>`
                    }
                </label>

                <input
                    id="currentInput"
                    class="input"
                    type="${step.type === "date" ? "date" : step.email ? "email" : "text"}"
                    placeholder="${escapeHTML(step.placeholder || "")}"
                    value="${escapeHTML(formData[step.key] || "")}"
                    oninput="saveInput('${step.key}', this.value)"
                >

                <div
                    id="fieldError"
                    class="error">
                </div>

            </div>
        `;
    }


    if (step.type === "textarea") {

        return `
            <div class="field">

                <label class="field-label">
                    ${escapeHTML(step.title)}
                    ${
                        step.required
                            ? ""
                            : `<span class="optional"> (optional)</span>`
                    }
                </label>

                <textarea
                    class="textarea"
                    placeholder="${escapeHTML(step.placeholder || "")}"
                    oninput="saveInput('${step.key}', this.value)"
                >${escapeHTML(formData[step.key] || "")}</textarea>

                <div
                    id="fieldError"
                    class="error">
                </div>

            </div>
        `;
    }


    /*
     * RADIO
     */

    if (step.type === "radio") {

        return `
            <div
                class="field option-list radio"
                role="radiogroup">

                ${step.options.map((option, index) => {

                    const value = getOptionValue(option);
                    const title = getOptionTitle(option);
                    const description = getOptionDescription(option);

                    return `
                        <label
                            class="option-card"
                            data-radio="${escapeHTML(value)}">

                            <input
                                type="radio"
                                name="${escapeHTML(step.key)}"
                                value="${escapeHTML(value)}"
                                onchange="selectRadio(
                                    '${escapeHTML(step.key)}',
                                    '${escapeHTML(value)}'
                                )"
                            >

                            <span class="option-indicator"></span>

                            <span class="option-content">

                                <span class="option-title">
                                    ${escapeHTML(title)}
                                </span>

                                ${
                                    description
                                        ? `
                                        <span class="option-description">
                                            ${escapeHTML(description)}
                                        </span>
                                        `
                                        : ""
                                }

                            </span>

                        </label>
                    `;

                }).join("")}

                <div id="fieldError" class="error"></div>

            </div>
        `;
    }


    /*
     * CHECKBOX MULTIPLE
     */

    if (step.type === "checkbox") {

        return `
            <div class="field option-list checkbox">

                ${step.options.map(option => {

                    const value = getOptionValue(option);
                    const title = getOptionTitle(option);
                    const description = getOptionDescription(option);

                    return `
                        <label
                            class="option-card"
                            data-checkbox="${escapeHTML(value)}">

                            <input
                                type="checkbox"
                                value="${escapeHTML(value)}"
                                onchange="toggleCheckbox(
                                    '${escapeHTML(step.key)}',
                                    '${escapeHTML(value)}'
                                )"
                            >

                            <span class="option-indicator"></span>

                            <span class="option-content">

                                <span class="option-title">
                                    ${escapeHTML(title)}
                                </span>

                                ${
                                    description
                                        ? `
                                        <span class="option-description">
                                            ${escapeHTML(description)}
                                        </span>
                                        `
                                        : ""
                                }

                            </span>

                        </label>
                    `;

                }).join("")}

                <div id="fieldError" class="error"></div>

            </div>
        `;
    }


    /*
     * CHIPS MULTIPLE
     */

    if (step.type === "chips") {

        return `
            <div class="field">

                <div class="chips">

                    ${step.options.map(option => {

                        const value =
                            getOptionValue(option);

                        return `
                            <button
                                type="button"
                                class="chip"
                                data-chip="${escapeHTML(value)}"
                                onclick="toggleChip(
                                    '${escapeHTML(step.key)}',
                                    '${escapeHTML(value)}',
                                    this
                                )">

                                ${escapeHTML(
                                    getOptionTitle(option)
                                )}

                            </button>
                        `;

                    }).join("")}

                </div>

                <div id="fieldError" class="error"></div>

            </div>
        `;
    }


    /*
     * SINGLE CHECKBOX
     */

    if (step.type === "singleCheckbox") {

        return `
            <div class="field checkbox">

                <label
                    class="option-card"
                    data-single-checkbox>

                    <input
                        type="checkbox"
                        onchange="toggleSingleCheckbox(
                            '${escapeHTML(step.key)}'
                        )"
                    >

                    <span class="option-indicator"></span>

                    <span class="option-content">

                        <span class="option-title">
                            I confirm this
                        </span>

                        <span class="option-description">
                            ${escapeHTML(step.description)}
                        </span>

                    </span>

                </label>

                <div id="fieldError" class="error"></div>

            </div>
        `;
    }


    /*
     * REVIEW
     */

    if (step.type === "review") {

        return `
            <div class="review">

                ${reviewRow("Username", formData.username)}

                ${reviewRow("Legal name", formData.legalName)}

                ${reviewRow("Date of birth", formData.dateOfBirth)}

                ${reviewRow("Country", formData.country)}

                ${reviewRow("Phone", formData.phone)}

                ${reviewRow("Account type", formData.accountCategory)}

                ${reviewRow("Profession", formData.profession)}

                ${reviewRow(
                    "Verification reason",
                    formData.verificationReason
                )}

                ${reviewRow(
                    "Known for",
                    formData.knownFor
                )}

                ${reviewRow(
                    "Website",
                    formData.website || "Not provided"
                )}

                ${reviewRow(
                    "Social profile",
                    formData.socialProfile
                )}

                ${reviewRow(
                    "Audience",
                    formData.audience.join(", ")
                )}

                ${reviewRow(
                    "Content",
                    formData.contentCategory.join(", ")
                )}

                ${reviewRow(
                    "Achievements",
                    formData.achievement
                )}

                ${reviewRow(
                    "Public presence",
                    formData.publicPresence.join(", ")
                )}

                ${reviewRow(
                    "Email",
                    formData.email
                )}

            </div>
        `;
    }


    return "";
}


function reviewRow(label, value) {

    return `
        <div class="review-row">

            <div class="review-label">
                ${escapeHTML(label)}
            </div>

            <div class="review-value">
                ${escapeHTML(value || "—")}
            </div>

        </div>
    `;
}


/*
|--------------------------------------------------------------------------
| SAVE TEXT INPUT
|--------------------------------------------------------------------------
*/

function saveInput(key, value) {

    formData[key] = value;
}


/*
|--------------------------------------------------------------------------
| RADIO - ONE SELECTABLE
|--------------------------------------------------------------------------
*/

function selectRadio(key, value) {

    formData[key] = value;

    document
        .querySelectorAll("[data-radio]")
        .forEach(card => {

            card.classList.toggle(
                "selected",
                card.dataset.radio === value
            );

        });
}


/*
|--------------------------------------------------------------------------
| CHECKBOX - MULTIPLE SELECTABLE
|--------------------------------------------------------------------------
*/

function toggleCheckbox(key, value) {

    if (!Array.isArray(formData[key])) {
        formData[key] = [];
    }

    const index =
        formData[key].indexOf(value);

    if (index === -1) {

        formData[key].push(value);

    } else {

        formData[key].splice(index, 1);

    }

    const card =
        document.querySelector(
            `[data-checkbox="${CSS.escape(value)}"]`
        );

    if (card) {

        card.classList.toggle(
            "selected",
            formData[key].includes(value)
        );

    }
}


/*
|--------------------------------------------------------------------------
| CHIPS - MULTIPLE SELECTABLE
|--------------------------------------------------------------------------
*/

function toggleChip(key, value, button) {

    if (!Array.isArray(formData[key])) {
        formData[key] = [];
    }

    const index =
        formData[key].indexOf(value);

    if (index === -1) {

        formData[key].push(value);

    } else {

        formData[key].splice(index, 1);

    }

    button.classList.toggle(
        "selected",
        formData[key].includes(value)
    );
}


/*
|--------------------------------------------------------------------------
| SINGLE CHECKBOX
|--------------------------------------------------------------------------
*/

function toggleSingleCheckbox(key) {

    formData[key] =
        !formData[key];

    const card =
        document.querySelector(
            "[data-single-checkbox]"
        );

    if (card) {

        card.classList.toggle(
            "selected",
            formData[key]
        );

    }
}


/*
|--------------------------------------------------------------------------
| RESTORE SELECTED STATE
|--------------------------------------------------------------------------
*/

function restoreSelections() {

    const step = steps[currentStep];

    if (!step.key) return;


    /*
     * RADIO
     */

    if (step.type === "radio") {

        document
            .querySelectorAll("[data-radio]")
            .forEach(card => {

                const value =
                    card.dataset.radio;

                const selected =
                    formData[step.key] === value;

                card.classList.toggle(
                    "selected",
                    selected
                );

                const input =
                    card.querySelector("input");

                if (input) {
                    input.checked = selected;
                }

            });
    }


    /*
     * CHECKBOX
     */

    if (step.type === "checkbox") {

        const selected =
            Array.isArray(formData[step.key])
                ? formData[step.key]
                : [];

        document
            .querySelectorAll("[data-checkbox]")
            .forEach(card => {

                const value =
                    card.dataset.checkbox;

                const active =
                    selected.includes(value);

                card.classList.toggle(
                    "selected",
                    active
                );

                const input =
                    card.querySelector("input");

                if (input) {
                    input.checked = active;
                }

            });
    }


    /*
     * CHIPS
     */

    if (step.type === "chips") {

        const selected =
            Array.isArray(formData[step.key])
                ? formData[step.key]
                : [];

        document
            .querySelectorAll("[data-chip]")
            .forEach(chip => {

                chip.classList.toggle(
                    "selected",
                    selected.includes(chip.dataset.chip)
                );

            });
    }


    /*
     * SINGLE CHECKBOX
     */

    if (step.type === "singleCheckbox") {

        const card =
            document.querySelector(
                "[data-single-checkbox]"
            );

        if (card) {

            card.classList.toggle(
                "selected",
                Boolean(formData[step.key])
            );

            const input =
                card.querySelector("input");

            if (input) {
                input.checked =
                    Boolean(formData[step.key]);
            }

        }
    }
}


/*
|--------------------------------------------------------------------------
| VALIDATION
|--------------------------------------------------------------------------
*/

function validateStep() {

    const step = steps[currentStep];

    if (!step.required) {
        return true;
    }


    /*
     * TEXT
     */

    if (
        step.type === "text" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        const value =
            String(formData[step.key] || "")
                .trim();

        if (!value) {

            showFieldError(
                "Please complete this field."
            );

            return false;
        }

        if (
            step.email &&
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
        ) {

            showFieldError(
                "Please enter a valid email address."
            );

            return false;
        }
    }


    /*
     * RADIO
     */

    if (step.type === "radio") {

        if (!formData[step.key]) {

            showFieldError(
                "Please select one option."
            );

            return false;
        }
    }


    /*
     * MULTI CHECKBOX / CHIPS
     */

    if (
        step.type === "checkbox" ||
        step.type === "chips"
    ) {

        if (
            !Array.isArray(formData[step.key]) ||
            formData[step.key].length === 0
        ) {

            showFieldError(
                "Please select at least one option."
            );

            return false;
        }
    }


    /*
     * SINGLE CHECKBOX
     */

    if (step.type === "singleCheckbox") {

        if (!formData[step.key]) {

            showFieldError(
                "You must confirm this before continuing."
            );

            return false;
        }
    }


    return true;
}


function showFieldError(message) {

    const error =
        document.getElementById("fieldError");

    if (error) {
        error.textContent = message;
    }
}


/*
|--------------------------------------------------------------------------
| NAVIGATION
|--------------------------------------------------------------------------
*/

function nextStep() {

    if (isSubmitting) {
        return;
    }

    if (!validateStep()) {
        return;
    }


    /*
     * REVIEW = SUBMIT
     */

    if (currentStep === steps.length - 1) {

        submitVerification();

        return;
    }


    currentStep++;

    renderStep();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function previousStep() {

    if (currentStep <= 0) {
        return;
    }

    currentStep--;

    renderStep();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/*
|--------------------------------------------------------------------------
| TOOLBAR PROGRESS
|--------------------------------------------------------------------------
*/

function updateProgress() {

    const total =
        steps.length;

    const number =
        currentStep + 1;

    const percent =
        (number / total) * 100;

    document.getElementById(
        "progressNumber"
    ).textContent =
        `${number} / ${total}`;

    document.getElementById(
        "progressFill"
    ).style.width =
        `${percent}%`;
}


function updateToolbar() {

    const back =
        document.getElementById("backBtn");

    if (currentStep === 0) {

        back.classList.add("hidden");

    } else {

        back.classList.remove("hidden");

    }
}


function updateButton() {

    const button =
        document.getElementById("continueBtn");

    if (currentStep === steps.length - 1) {

        button.textContent =
            "Submit application";

    } else if (currentStep === 0) {

        button.textContent =
            "Start application";

    } else {

        button.textContent =
            "Continue";
    }
}


/*
|--------------------------------------------------------------------------
| SUBMIT
|--------------------------------------------------------------------------
|
| IMPORTANT:
|
| The UI does NOT show success merely because the API
| returned HTTP 200.
|
| Backend must explicitly return:
|
| {
|    "email_sent": true
| }
|
| Only then will the application be shown as successfully
| submitted.
|
|--------------------------------------------------------------------------
*/

async function submitVerification() {

    isSubmitting = true;

    const button =
        document.getElementById("continueBtn");

    button.disabled = true;

    button.textContent =
        "Submitting...";


    try {

        const payload = {

            ...formData,

            username:
                String(formData.username || "")
                    .trim()
                    .replace(/^@/, ""),

            email:
                String(formData.email || "")
                    .trim()
                    .toLowerCase()

        };


        const response =
            await fetch(
                `${API_BASE}/api/verification?action=submit`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(payload)
                }
            );


        const raw =
            await response.text();


        let data = {};

        try {

            data =
                raw
                    ? JSON.parse(raw)
                    : {};

        } catch {

            data = {
                message: raw
            };

        }


        /*
         * Existing verification states
         */

        if (
            data.code === "ALREADY_APPROVED" ||
            data.code === "VERIFIED"
        ) {

            showExistingVerification(
                "This account is already verified."
            );

            return;
        }


        if (data.code === "PENDING") {

            showExistingVerification(
                "A verification application is already pending."
            );

            return;
        }


        if (data.code === "REJECTED") {

            showError(
                data.message ||
                "This application cannot be submitted at this time."
            );

            return;
        }


        if (
            data.code === "USERNAME_NOT_FOUND" ||
            data.code === "INVALID_USERNAME"
        ) {

            showError(
                data.message ||
                "The username could not be verified."
            );

            return;
        }


        /*
         * HTTP failure
         */

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to submit application."
            );
        }


        /*
         * CRITICAL EMAIL CHECK
         *
         * Do NOT show success unless backend explicitly
         * confirms that the email was sent.
         */

        if (data.email_sent !== true) {

            throw new Error(
                data.message ||
                "The application was not confirmed because the verification email was not successfully sent."
            );
        }


        /*
         * ONLY HERE = SUCCESS
         */

        showSuccess(data);

    } catch (error) {

        showError(
            error.message ||
            "Something went wrong while submitting the application."
        );

    } finally {

        isSubmitting = false;

        button.disabled = false;

        button.textContent =
            "Submit application";
    }
}


/*
|--------------------------------------------------------------------------
| SUCCESS
|--------------------------------------------------------------------------
*/

function showSuccess(data) {

    document.querySelector(".page").innerHTML = `

        <div class="success">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Application submitted
            </h1>

            <p>
                Your verification application has been
                submitted successfully.
            </p>

            <p>
                A confirmation email has been sent to
                <strong>
                    ${escapeHTML(formData.email)}
                </strong>.
            </p>

            <button
                class="primary-btn"
                onclick="goHome()">
                Done
            </button>

        </div>
    `;
}


/*
|--------------------------------------------------------------------------
| EXISTING VERIFICATION
|--------------------------------------------------------------------------
*/

function showExistingVerification(message) {

    document.querySelector(".page").innerHTML = `

        <div class="success">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Verification status
            </h1>

            <p>
                ${escapeHTML(message)}
            </p>

            <button
                class="primary-btn"
                onclick="goHome()">
                Done
            </button>

        </div>
    `;
}


/*
|--------------------------------------------------------------------------
| ERROR
|--------------------------------------------------------------------------
*/

function showError(message) {

    document.querySelector(".page").innerHTML = `

        <div class="success">

            <div class="success-icon"
                 style="background:#fee2e2;color:#dc2626">
                !
            </div>

            <h1>
                Unable to submit
            </h1>

            <p>
                ${escapeHTML(message)}
            </p>

            <button
                class="primary-btn"
                onclick="location.reload()">
                Try again
            </button>

        </div>
    `;
}


/*
|--------------------------------------------------------------------------
| THEME
|--------------------------------------------------------------------------
*/

function toggleTheme() {

    const dark =
        document.documentElement.dataset.theme === "dark";

    if (dark) {

        delete document.documentElement.dataset.theme;

        document.body.style.background =
            "#f7f8fa";

        document.body.style.color =
            "#111827";

    } else {

        document.documentElement.dataset.theme =
            "dark";

        document.body.style.background =
            "#0f1115";

        document.body.style.color =
            "#f5f7fa";
    }
}


/*
|--------------------------------------------------------------------------
| HOME
|--------------------------------------------------------------------------
*/

function goHome() {

    window.location.href = "/";
}


/*
|--------------------------------------------------------------------------
| INITIAL RENDER
|--------------------------------------------------------------------------
*/

renderStep();

</script>

</body>
</html>
