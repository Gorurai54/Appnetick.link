<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Get Verified • Appnetick</title>

<link rel="icon" href="/20260313_121958.jpg">

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>

:root {

    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-secondary:#F7F7F7;

    --text:#212121;
    --secondary:#757575;
    --muted:#9E9E9E;

    --border:#DCDCDC;

    --input-bg:#F5F5F5;

    --primary:#2196F3;
    --primary-soft:rgba(33,150,243,0.10);

    --danger:#E53935;
    --success:#2E7D32;

    --shadow:
        0 8px 30px rgba(0,0,0,0.06);

    --radius:18px;
}


html[data-theme="dark"] {

    --bg:#1E1E1E;
    --surface:#1E1E1E;
    --surface-secondary:#252525;

    --text:#FFFFFF;
    --secondary:#A0A0A0;
    --muted:#777777;

    --border:#424242;

    --input-bg:#252525;

    --primary:#2979FF;
    --primary-soft:rgba(41,121,255,0.14);

    --danger:#EF5350;
    --success:#66BB6A;

    --shadow:
        0 8px 30px rgba(0,0,0,0.22);
}


* {

    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
}


html,
body {

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

}


body {

    background:var(--bg);

    color:var(--text);

    font-family:Inter,sans-serif;

    overflow-x:hidden;

    transition:
        background .25s ease,
        color .25s ease;
}


button,
input,
textarea,
select {

    font-family:inherit;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {

    height:64px;

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 12px 0 8px;

    position:sticky;

    top:0;

    z-index:100;

    background:var(--surface);

    border-bottom:1px solid var(--border);

}


.toolbar-left {

    display:flex;

    align-items:center;

    gap:4px;

}


.brand {

    font-size:20px;

    font-weight:700;

    letter-spacing:-.4px;

}


.toolbar-actions {

    display:flex;

    align-items:center;

    gap:4px;

}


.icon-btn {

    width:44px;
    height:44px;

    border:0;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent;

    color:var(--text);

    cursor:pointer;

    font-size:22px;

}


.icon-btn:active {

    transform:scale(.92);

}


#toolbarBack {

    visibility:hidden;

}


/* =========================================================
   PAGE
========================================================= */

.page {

    width:100%;

    max-width:430px;

    margin:0 auto;

    padding:
        24px
        20px
        30px;

    min-height:
        calc(100vh - 64px);

    display:flex;

    flex-direction:column;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-area {

    width:100%;

    margin-bottom:28px;

}


.progress-top {

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;

}


.progress-label {

    font-size:13px;

    font-weight:600;

    color:var(--secondary);

}


.progress-number {

    font-size:13px;

    color:var(--muted);

    font-weight:500;

}


.progress-track {

    width:100%;

    height:5px;

    border-radius:999px;

    overflow:hidden;

    background:var(--surface-secondary);

}


.progress-fill {

    height:100%;

    width:5%;

    border-radius:inherit;

    background:var(--primary);

    transition:width .3s ease;

}


/* =========================================================
   STEP VIEWPORT
========================================================= */

.step-viewport {

    width:100%;

    position:relative;

    overflow:hidden;

}


.step {

    width:100%;

}


/* =========================================================
   SLIDE
========================================================= */

.slide-next-enter {

    animation:
        slideNextEnter .30s
        cubic-bezier(.22,1,.36,1)
        both;

}


.slide-back-enter {

    animation:
        slideBackEnter .30s
        cubic-bezier(.22,1,.36,1)
        both;

}


@keyframes slideNextEnter {

    from {

        opacity:0;

        transform:
            translate3d(100%,0,0);

    }

    to {

        opacity:1;

        transform:
            translate3d(0,0,0);

    }

}


@keyframes slideBackEnter {

    from {

        opacity:0;

        transform:
            translate3d(-100%,0,0);

    }

    to {

        opacity:1;

        transform:
            translate3d(0,0,0);

    }

}


/* =========================================================
   STEP CONTENT
========================================================= */

.intro-icon {

    width:82px;
    height:82px;

    border-radius:25px;

    margin:
        8px auto 24px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:var(--primary-soft);

    color:var(--primary);

    font-size:42px;

}


.step-title {

    margin:0 0 10px;

    font-size:25px;

    line-height:1.22;

    font-weight:700;

    letter-spacing:-.5px;

}


.step-description {

    margin:0;

    color:var(--secondary);

    font-size:15px;

    line-height:1.65;

}


.intro-points {

    margin-top:26px;

    display:flex;

    flex-direction:column;

    gap:11px;

}


.intro-point {

    display:flex;

    align-items:flex-start;

    gap:12px;

    padding:14px;

    border-radius:16px;

    background:var(--surface-secondary);

    border:1px solid var(--border);

}


.intro-point-icon {

    width:36px;
    height:36px;

    flex:0 0 36px;

    border-radius:11px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--primary);

    background:var(--primary-soft);

    font-size:19px;

}


.intro-point-text {

    font-size:13px;

    line-height:1.5;

    color:var(--secondary);

}


.intro-point-text strong {

    display:block;

    color:var(--text);

    margin-bottom:3px;

    font-size:14px;

}


/* =========================================================
   QUESTION
========================================================= */

.question-label {

    display:block;

    margin:
        5px 0 9px;

    font-size:20px;

    font-weight:700;

    line-height:1.35;

}


.question-help {

    margin:
        0 0 20px;

    color:var(--secondary);

    font-size:14px;

    line-height:1.55;

}


/* =========================================================
   INPUT
========================================================= */

.input-wrap {

    position:relative;

    width:100%;

}


.input-icon {

    position:absolute;

    left:16px;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

    font-size:21px;

    pointer-events:none;

}


.form-input,
.form-textarea {

    width:100%;

    border:
        1px solid var(--border);

    outline:none;

    color:var(--text);

    background:var(--input-bg);

    border-radius:16px;

    font-size:15px;

    transition:
        border .2s ease,
        box-shadow .2s ease;

}


.form-input {

    min-height:54px;

    padding:
        0 16px;

}


.form-input.with-icon {

    padding-left:50px;

}


.form-textarea {

    min-height:135px;

    padding:16px;

    resize:none;

    line-height:1.55;

}


.form-input:focus,
.form-textarea:focus {

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        var(--primary-soft);

}


.form-input::placeholder,
.form-textarea::placeholder {

    color:var(--muted);

}


/* =========================================================
   CHIPS
========================================================= */

.chips {

    display:flex;

    flex-wrap:wrap;

    gap:9px;

}


.chip {

    border:
        1px solid var(--border);

    background:var(--surface);

    color:var(--secondary);

    border-radius:999px;

    padding:
        11px 15px;

    font-size:13px;

    font-weight:500;

    cursor:pointer;

}


.chip.selected {

    background:var(--primary-soft);

    color:var(--primary);

    border-color:var(--primary);

}


/* =========================================================
   CONFIRM
========================================================= */

.confirm-box {

    padding:17px;

    border-radius:17px;

    border:1px solid var(--border);

    background:var(--surface-secondary);

    cursor:pointer;

}


.confirm-row {

    display:flex;

    align-items:flex-start;

    gap:12px;

}


.custom-check {

    width:22px;
    height:22px;

    flex:0 0 22px;

    border-radius:7px;

    border:1.5px solid var(--muted);

    display:flex;

    align-items:center;
    justify-content:center;

    color:#FFFFFF;

    font-size:15px;

}


.confirm-box.checked .custom-check {

    border-color:var(--primary);

    background:var(--primary);

}


.confirm-text {

    color:var(--secondary);

    font-size:13px;

    line-height:1.55;

}


/* =========================================================
   BUTTON AREA
   IMPORTANT:
   Button stays directly below current option/input.
========================================================= */

.bottom-actions {

    width:100%;

    margin-top:18px;

    display:flex;

}


.next-button {

    width:100%;

    min-height:54px;

    border:0;

    border-radius:999px;

    background:var(--primary);

    color:#FFFFFF;

    font-size:15px;

    font-weight:600;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(33,150,243,.18);

}


.next-button:active {

    transform:scale(.985);

}


.next-button:disabled {

    opacity:.5;

    cursor:not-allowed;

    box-shadow:none;

}


/* =========================================================
   USER PREVIEW
========================================================= */

.user-preview {

    margin-top:18px;

    padding:15px;

    border:1px solid var(--border);

    border-radius:18px;

    background:var(--surface-secondary);

}


.user-preview-main {

    display:flex;

    align-items:center;

    gap:12px;

}


.user-avatar {

    width:52px;
    height:52px;

    border-radius:50%;

    object-fit:cover;

    background:var(--input-bg);

}


.user-preview-name {

    font-size:15px;

    font-weight:600;

    color:var(--text);

}


.user-preview-username {

    margin-top:3px;

    font-size:13px;

    color:var(--secondary);

}


.verified-badge {

    display:inline-flex;

    align-items:center;

    gap:4px;

    margin-top:7px;

    padding:
        4px 8px;

    border-radius:999px;

    background:var(--primary-soft);

    color:var(--primary);

    font-size:11px;

    font-weight:600;

}


/* =========================================================
   STATUS
========================================================= */

.status-card {

    margin-top:16px;

    padding:15px;

    border-radius:16px;

    background:var(--surface-secondary);

    border:1px solid var(--border);

    display:flex;

    align-items:flex-start;

    gap:10px;

}


.status-card i {

    color:var(--primary);

    font-size:20px;

}


.status-card span {

    color:var(--secondary);

    font-size:13px;

    line-height:1.5;

}


.status-card.success i {

    color:var(--success);

}


/* =========================================================
   REVIEW
========================================================= */

.review-card {

    border:
        1px solid var(--border);

    background:var(--surface-secondary);

    border-radius:18px;

    overflow:hidden;

}


.review-row {

    padding:
        13px 15px;

    border-bottom:
        1px solid var(--border);

}


.review-row:last-child {

    border-bottom:0;

}


.review-label {

    font-size:11px;

    color:var(--muted);

    margin-bottom:4px;

    text-transform:uppercase;

    letter-spacing:.5px;

    font-weight:600;

}


.review-value {

    font-size:14px;

    color:var(--text);

    line-height:1.45;

    word-break:break-word;

}


/* =========================================================
   INFO
========================================================= */

.info-card {

    margin-top:16px;

    padding:14px;

    border-radius:16px;

    background:var(--surface-secondary);

    border:1px solid var(--border);

    display:flex;

    gap:10px;

    align-items:flex-start;

}


.info-card i {

    color:var(--primary);

    font-size:19px;

}


.info-card span {

    color:var(--secondary);

    font-size:12px;

    line-height:1.55;

}


/* =========================================================
   SUCCESS
========================================================= */

.success {

    text-align:center;

    padding-top:35px;

}


.success-icon {

    width:86px;
    height:86px;

    margin:
        0 auto 24px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--primary);

    background:var(--primary-soft);

    font-size:44px;

}


.success h2 {

    margin:0 0 10px;

    font-size:25px;

}


.success p {

    margin:0;

    color:var(--secondary);

    font-size:14px;

    line-height:1.65;

}


@media(max-width:360px) {

    .page {

        padding-left:16px;
        padding-right:16px;

    }

    .step-title {

        font-size:23px;

    }

    .question-label {

        font-size:19px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     TOOLBAR
======================================================= -->

<header class="toolbar">

    <div class="toolbar-left">

        <button
            class="icon-btn"
            id="toolbarBack"
            type="button"
            onclick="previousStep()"
            aria-label="Back"
        >

            <i class="ph ph-arrow-left"></i>

        </button>

        <div class="brand">
            Appnetick.
        </div>

    </div>


    <div class="toolbar-actions">

        <button
            class="icon-btn"
            id="themeButton"
            type="button"
            aria-label="Change theme"
        >

            <i class="ph ph-moon"></i>

        </button>

        <button
            class="icon-btn"
            type="button"
            onclick="goHome()"
            aria-label="Home"
        >

            <i class="ph ph-house"></i>

        </button>

    </div>

</header>


<main class="page">


    <!-- ===================================================
         PROGRESS
    =================================================== -->

    <div class="progress-area">

        <div class="progress-top">

            <span
                class="progress-label"
                id="progressLabel"
            >
                Verification
            </span>

            <span
                class="progress-number"
                id="progressNumber"
            >
                1 of 20
            </span>

        </div>


        <div class="progress-track">

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>

    </div>


    <!-- ===================================================
         ONLY ONE STEP EXISTS HERE
         This fixes duplicate pages.
    =================================================== -->

    <div
        class="step-viewport"
        id="stepViewport"
    ></div>


    <!-- ===================================================
         CURRENT STEP BUTTON
         Moved dynamically directly below option/input.
    =================================================== -->

    <div
        class="bottom-actions"
        id="bottomActions"
    >

        <button
            class="next-button"
            id="nextButton"
            type="button"
            onclick="nextStep()"
        >

            <span id="nextText">
                Get started
            </span>

            <i
                class="ph ph-arrow-right"
                id="nextIcon"
            ></i>

        </button>

    </div>


</main>


<script>

/* =========================================================
   API
========================================================= */

const API_BASE =
    "https://api-appnetick.vercel.app";


/* =========================================================
   THEME
========================================================= */

const savedTheme =
    localStorage.getItem("appnetick-theme");


if (savedTheme === "dark") {

    document.documentElement
        .setAttribute(
            "data-theme",
            "dark"
        );

}


function updateThemeIcon() {

    const icon =
        document
            .getElementById("themeButton")
            .querySelector("i");

    const dark =
        document.documentElement
            .getAttribute("data-theme")
            === "dark";

    icon.className =
        dark
            ? "ph ph-sun"
            : "ph ph-moon";

}


updateThemeIcon();


document
    .getElementById("themeButton")
    .addEventListener(
        "click",
        function() {

            const dark =
                document.documentElement
                    .getAttribute("data-theme")
                    === "dark";

            if (dark) {

                document.documentElement
                    .removeAttribute(
                        "data-theme"
                    );

                localStorage.setItem(
                    "appnetick-theme",
                    "light"
                );

            } else {

                document.documentElement
                    .setAttribute(
                        "data-theme",
                        "dark"
                    );

                localStorage.setItem(
                    "appnetick-theme",
                    "dark"
                );

            }

            updateThemeIcon();

        }
    );


/* =========================================================
   FORM DATA
========================================================= */

const formData = {

    uid:"",
    username:"",
    fullName:"",
    email:"",

    legalName:"",
    dateOfBirth:"",

    country:"",
    phone:"",

    accountCategory:"",
    profession:"",

    verificationReason:"",
    knownFor:"",

    website:"",
    socialProfile:"",

    audience:"",
    contentCategory:"",

    achievement:"",
    publicPresence:"",

    authenticityConfirmed:false,
    informationConfirmed:false,
    termsConfirmed:false

};


/* =========================================================
   VERIFIED USER
========================================================= */

let usernameChecked = false;

let usernameCheckInProgress = false;

let foundUser = null;


/* =========================================================
   STEPS
========================================================= */

const steps = [

    {
        type:"intro"
    },


    {
        type:"username"
    },


    {
        type:"input",

        key:"legalName",

        title:"What is your legal name?",

        help:
            "Enter your full legal name exactly as it appears on your official records.",

        icon:"ph-user",

        placeholder:"Enter your legal name"
    },


    {
        type:"date",

        key:"dateOfBirth",

        title:"What is your date of birth?",

        help:
            "Your date of birth helps us establish that the account belongs to a real person.",

        icon:"ph-calendar-blank"
    },


    {
        type:"chips",

        key:"country",

        title:"Where are you based?",

        help:
            "Select the country that best represents your current primary location.",

        options:[
            "India",
            "United States",
            "United Kingdom",
            "Canada",
            "Australia",
            "UAE",
            "Other"
        ]
    },


    {
        type:"input",

        key:"phone",

        title:"What is your phone number?",

        help:
            "Use a phone number that you control.",

        icon:"ph-phone",

        placeholder:"+91 XXXXX XXXXX",

        inputType:"tel"
    },


    {
        type:"chips",

        key:"accountCategory",

        title:"What best describes your account?",

        help:
            "Choose the category that most accurately represents your public presence.",

        options:[
            "Creator",
            "Public Figure",
            "Artist",
            "Musician",
            "Business",
            "Brand",
            "Professional",
            "Organization",
            "Community",
            "Other"
        ]
    },


    {
        type:"input",

        key:"profession",

        title:"What is your profession or role?",

        help:
            "Tell us what you currently do publicly or professionally.",

        icon:"ph-briefcase",

        placeholder:"Example: Photographer"
    },


    {
        type:"textarea",

        key:"verificationReason",

        title:"Why should this account be verified?",

        help:
            "Explain why people may search for or recognize you.",

        placeholder:
            "Tell us why this account deserves verification..."
    },


    {
        type:"textarea",

        key:"knownFor",

        title:"What are you known for?",

        help:
            "Describe your main work, public identity, achievements or contribution.",

        placeholder:
            "Example: I create educational technology content..."
    },


    {
        type:"input",

        key:"website",

        title:"Do you have an official website?",

        help:
            "Add a website that can help us confirm your public presence. This can be skipped.",

        icon:"ph-globe",

        placeholder:"https://example.com",

        inputType:"url",

        optional:true
    },


    {
        type:"input",

        key:"socialProfile",

        title:"Add another public profile",

        help:
            "Provide one public social profile or professional page.",

        icon:"ph-link",

        placeholder:"https://..."
    },


    {
        type:"chips",

        key:"audience",

        title:"What is your approximate audience size?",

        help:
            "Choose the closest range.",

        options:[
            "Under 1K",
            "1K – 10K",
            "10K – 50K",
            "50K – 100K",
            "100K – 500K",
            "500K – 1M",
            "1M+"
        ]
    },


    {
        type:"chips",

        key:"contentCategory",

        title:"What type of content do you primarily share?",

        help:
            "Select the category that best describes your public activity.",

        options:[
            "Education",
            "Entertainment",
            "Technology",
            "Music",
            "Fashion",
            "Sports",
            "News",
            "Business",
            "Lifestyle",
            "Other"
        ]
    },


    {
        type:"textarea",

        key:"achievement",

        title:"Tell us about your notable achievements",

        help:
            "Mention awards, professional accomplishments, major projects or other meaningful achievements.",

        placeholder:
            "Describe your achievements..."
    },


    {
        type:"textarea",

        key:"publicPresence",

        title:"Where can your public presence be verified?",

        help:
            "Mention publications, interviews, websites, events or organizations.",

        placeholder:
            "Example: Featured by..., interviewed by..."
    },


    {
        type:"confirm",

        key:"authenticityConfirmed",

        title:"Confirm account authenticity",

        text:
            "I confirm that this Appnetick account represents me, my organization, brand or entity described in this application."
    },


    {
        type:"confirm",

        key:"informationConfirmed",

        title:"Confirm your information",

        text:
            "I confirm that the information submitted in this verification application is accurate and complete to the best of my knowledge."
    },


    {
        type:"confirm",

        key:"termsConfirmed",

        title:"Verification declaration",

        text:
            "I understand that submitting this application does not guarantee verification. Appnetick may approve or reject the request after review."
    },


    {
        type:"review"
    }

];


let currentStep = 0;

let isAnimating = false;


/* =========================================================
   ELEMENTS
========================================================= */

const viewport =
    document.getElementById(
        "stepViewport"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const progressNumber =
    document.getElementById(
        "progressNumber"
    );

const progressLabel =
    document.getElementById(
        "progressLabel"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const nextText =
    document.getElementById(
        "nextText"
    );

const nextIcon =
    document.getElementById(
        "nextIcon"
    );

const toolbarBack =
    document.getElementById(
        "toolbarBack"
    );


/* =========================================================
   RENDER
   IMPORTANT:
   Existing element is REPLACED.
   It is never appended.
========================================================= */

function renderStep(
    direction="next",
    animate=false
) {

    const step =
        steps[currentStep];


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "step";


    element.innerHTML =
        getStepHTML(step);


    if (animate) {

        element.classList.add(
            direction === "next"
                ? "slide-next-enter"
                : "slide-back-enter"
        );

    }


    viewport.replaceChildren(
        element
    );


    restoreFieldValue();

    updateProgress();

    updateButtons();

    updateToolbar();


    if (
        step.type === "username"
    ) {

        setupUsernameStep();

    }

}

/* =========================================================
   USERNAME STEP
========================================================= */

function setupUsernameStep() {

    const input =
        document.getElementById(
            "usernameInput"
        );

    if (!input) return;


    input.value =
        formData.username || "";


    input.addEventListener(
        "input",
        function() {

            formData.username =
                normalizeUsername(
                    input.value
                );

            usernameChecked =
                false;

            foundUser =
                null;

            renderUsernameStatus();

            updateButtons();

        }
    );


    renderUsernameStatus();

}


/* =========================================================
   USERNAME NORMALIZE
========================================================= */

function normalizeUsername(value) {

    return String(value || "")
        .trim()
        .replace(/^@+/, "")
        .toLowerCase();

}


/* =========================================================
   USERNAME LOOKUP
========================================================= */

async function checkUsername() {

    const username =
        normalizeUsername(
            formData.username
        );


    if (!username) {

        showError(
            "Please enter your Appnetick username."
        );

        return false;

    }


    usernameCheckInProgress =
        true;

    updateButtons();


    renderTemporaryStatus(
        "Checking username..."
    );


    try {

        const response =
            await fetch(
                `${API_BASE}/api/verification/check-username?username=${encodeURIComponent(username)}`,
                {
                    method:"GET",

                    headers:{
                        "Accept":"application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to check username."
            );

        }


        if (!data.exists) {

            usernameChecked =
                false;

            foundUser =
                null;

            renderUsernameNotFound();

            return false;

        }


        foundUser =
            data.user || null;


        formData.uid =
            data.user.uid || "";


        formData.username =
            data.user.username || username;


        formData.fullName =
            data.user.full_name || "";


        formData.email =
            data.user.email || "";


        usernameChecked =
            true;


        /*
         * VERY IMPORTANT:
         * If verification already exists,
         * stop before application continues.
         */

        if (data.verification) {

            showExistingVerification(
                data.verification
            );

            return false;

        }


        renderUsernameUser();

        return true;


    } catch(error) {

        console.error(
            "Username check:",
            error
        );

        usernameChecked =
            false;

        showError(
            "Unable to check this username. Please try again."
        );

        return false;


    } finally {

        usernameCheckInProgress =
            false;

        updateButtons();

    }

}

========================================================= */

function showExistingVerification(

) {

        "100%";


    let title =
        "Verification already completed";

    let description =
        "This account already has a completed verification status.";

    let icon =
        "ph-seal-check";

        verification.verification_status
        === "pending"
    ) {

        title =
            "Application already under review";

        description =
            "A verification application for this username is already being reviewed by Appnetick.";

        icon =
            "ph-hourglass";

    }


    if (
        verification.verification_status
        === "rejected"
    ) {

        title =

        description =
            "A previous verification application was rejected. You may be able to submit another application after the applicable review period.";

            "ph-x-circle";

/* =========================================================
   CHIP
========================================================= */

function selectChip(element) {

    document
        .querySelectorAll(".chip")
        .forEach(
            chip =>
                chip.classList.remove(
                    "selected"
                )
        );


    element.classList.add(
        "selected"
    );


    formData[
        steps[currentStep].key
    ] =
        element.dataset.value;


    updateButtons();

}


/* =========================================================
   CONFIRM
========================================================= */

function toggleConfirm() {

    const box =
        document.getElementById(
            "confirmBox"
        );


    if (!box) return;


    const key =
        steps[currentStep].key;


    formData[key] =
        !formData[key];


    box.classList.toggle(
        "checked",
        formData[key]
    );


    updateButtons();

}


/* =========================================================
   SAVE CURRENT VALUE
========================================================= */

function saveCurrentValue() {

    const step =
        steps[currentStep];


    if (
        step.type === "input" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        const input =
            document.getElementById(
                "currentInput"
            );


        if (input) {

            formData[step.key] =
                input.value.trim();

        }

    }


    if (
        step.type === "username"
    ) {

        const input =
            document.getElementById(
                "usernameInput"
            );


        if (input) {

            formData.username =
                normalizeUsername(
                    input.value
                );

        }

    }

}


/* =========================================================
   RESTORE
========================================================= */

function restoreFieldValue() {

    const step =
        steps[currentStep];


    if (
        step.type === "input" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        const input =
            document.getElementById(
                "currentInput"
            );


        if (
            input &&
            formData[step.key]
        ) {

            input.value =
                formData[step.key];

        }

    }


    if (step.type === "chips") {

        const selected =
            formData[step.key];


        if (!selected) return;


        document
            .querySelectorAll(".chip")
            .forEach(
                chip => {

                    if (
                        chip.dataset.value
                        === selected
                    ) {

                        chip.classList.add(
                            "selected"
                        );

                    }

                }
            );

    }


    if (step.type === "confirm") {

        const box =
            document.getElementById(
                "confirmBox"
            );


        if (
            box &&
            formData[step.key]
        ) {

            box.classList.add(
                "checked"
            );

        }

    }

}


/* =========================================================
   VALIDATION
========================================================= */

function validateCurrentStep() {

    const step =
        steps[currentStep];


    if (
        step.type === "intro"
    ) {

        return true;

    }


    if (
        step.type === "username"
    ) {

        saveCurrentValue();


        if (
            !formData.username
        ) {

            showError(
                "Please enter your username."
            );

            return false;

        }


        if (
            !usernameChecked
        ) {

            showError(
                "Please check your username before continuing."
            );

            return false;

        }


        return true;

    }


    if (
        step.type === "input" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        saveCurrentValue();


        if (
            !formData[step.key] &&
            !step.optional
        ) {

            showError(
                "Please enter this information before continuing."
            );

            return false;

        }

    }


    if (step.type === "chips") {

        if (
            !formData[step.key]
        ) {

            showError(
                "Please select one option to continue."
            );

            return false;

        }

    }


    if (step.type === "confirm") {

        if (
            !formData[step.key]
        ) {

            showError(
                "Please confirm this before continuing."
            );

            return false;

        }

    }


    return true;

}


/* =========================================================
   NEXT
========================================================= */

async function nextStep() {

    if (isAnimating) return;


    if (
        currentStep === 1 &&
        !usernameChecked
    ) {

        const success =
            await checkUsername();


        if (!success) {

            return;

        }

    }


    if (
        !validateCurrentStep()
    ) {

        return;

    }


    if (
        currentStep >=
        steps.length - 1
    ) {

        submitVerification();

        return;

    }


    isAnimating =
        true;


    saveCurrentValue();


    currentStep++;


    renderStep(
        "next",
        true
    );


    setTimeout(
        () => {

            isAnimating =
                false;

        },
        320
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   BACK
========================================================= */

function previousStep() {

    if (isAnimating) return;


    /*
     * If current screen is first step,
     * go home.
     */

    if (currentStep <= 0) {

        goHome();

        return;

    }


    saveCurrentValue();


    isAnimating =
        true;


    currentStep--;


    renderStep(
        "back",
        true
    );


    setTimeout(
        () => {

            isAnimating =
                false;

        },
        320
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   TOOLBAR
========================================================= */

function updateToolbar() {

    if (
        currentStep <= 0
    ) {

        toolbarBack.style.visibility =
            "hidden";

    } else {

        toolbarBack.style.visibility =
            "visible";

    }

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const total =
        steps.length;


    const number =
        currentStep + 1;


    const percentage =
        (number / total) * 100;


    progressNumber.textContent =
        `${number} of ${total}`;


    progressFill.style.width =
        `${percentage}%`;


    if (
        currentStep === 0
    ) {

        progressLabel.textContent =
            "Verification";

    } else if (
        currentStep === total - 1
    ) {

        progressLabel.textContent =
            "Review";

    } else {

        progressLabel.textContent =
            "Application";

    }

}


/* =========================================================
   BUTTON
========================================================= */

function updateButtons() {

    nextButton.style.display =
        "flex";


    nextButton.disabled =
        false;


    nextIcon.style.animation =
        "";


    if (
        currentStep === 0
    ) {

        nextText.textContent =
            "Get started";


        nextIcon.className =
            "ph ph-arrow-right";


        return;

    }


    if (
        currentStep === 1
    ) {

        if (
            usernameCheckInProgress
        ) {

            nextText.textContent =
                "Checking...";

            nextIcon.className =
                "ph ph-spinner";

            nextIcon.style.animation =
                "spin .8s linear infinite";

            nextButton.disabled =
                true;

        } else if (
            usernameChecked
        ) {

            nextText.textContent =
                "Continue";

            nextIcon.className =
                "ph ph-arrow-right";

        } else {

            nextText.textContent =
                "Check username";

            nextIcon.className =
                "ph ph-magnifying-glass";

        }

        return;

    }


    if (
        currentStep ===
        steps.length - 1
    ) {

        nextText.textContent =
            "Submit application";

        nextIcon.className =
            "ph ph-paper-plane-tilt";

        return;

    }


    nextText.textContent =
        "Continue";

    nextIcon.className =
        "ph ph-arrow-right";

}

/* =========================================================
   SUBMIT
========================================================= */

async function submitVerification() {

    if (isAnimating) return;


    saveCurrentValue();


    nextButton.disabled =
        true;


    nextText.textContent =
        "Submitting...";


    nextIcon.className =
        "ph ph-spinner";


    nextIcon.style.animation =
        "spin .8s linear infinite";


    const payload = {

        uid:
            formData.uid,

        username:
            formData.username,

        full_name:
            formData.fullName,

        legal_name:
            formData.legalName,

        email:
            formData.email,

        date_of_birth:
            formData.dateOfBirth,

        country:
            formData.country,

        phone:
            formData.phone,

        account_category:
            formData.accountCategory,

        profession:
            formData.profession,

        verification_reason:
            formData.verificationReason,

        known_for:
            formData.knownFor,

        website:
            formData.website,

        social_profile:
            formData.socialProfile,

        audience:
            formData.audience,

        content_category:
            formData.contentCategory,

        achievement:
            formData.achievement,

        public_presence:
            formData.publicPresence,

        authenticity_confirmed:
            formData.authenticityConfirmed,

        information_confirmed:
            formData.informationConfirmed,

        terms_confirmed:
            formData.termsConfirmed

    };


    try {

        const response =
            await fetch(
                `${API_BASE}/api/verification/submit`,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            if (
                data.code ===
                "ALREADY_VERIFIED"
            ) {

                showExistingVerification({
                    verification_status:
                        "approved"
                });

                return;

            }


            if (
                data.code ===
                "ALREADY_PENDING"
            ) {

                showExistingVerification({
                    verification_status:
                        "pending"
                });

                return;

            }


            throw new Error(
                data.error ||
                "Unable to submit application."
            );

        }


        showSuccess();

    } catch(error) {

        console.error(
            "Verification submit:",
            error
        );


        nextButton.disabled =
            false;


        nextText.textContent =
            "Submit application";


        nextIcon.className =
            "ph ph-paper-plane-tilt";


        nextIcon.style.animation =
            "";


        showError(
            error.message ||
            "Something went wrong. Please try again."
        );

    }

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess() {

    document.getElementById(
        "bottomActions"
    ).style.display =
        "none";


    toolbarBack.style.visibility =
        "visible";


    progressLabel.textContent =
        "Submitted";


    progressNumber.textContent =
        "Complete";


    progressFill.style.width =
        "100%";


    viewport.innerHTML = `

        <div class="success">

            <div class="success-icon">

                <i class="ph ph-check"></i>

            </div>

            <h2>
                Application submitted
            </h2>

            <p>

                Your verification request has been
                submitted successfully.

                <br><br>

                Appnetick will review the information
                provided and update the verification
                status when the review is complete.

            </p>

        </div>

    `;

}


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    let existing =
        document.getElementById(
            "formError"
        );


    if (existing) {

        existing.remove();

    }


    const error =
        document.createElement(
            "div"
        );


    error.id =
        "formError";


    error.style.cssText = `

        margin-top:14px;
        padding:12px 14px;
        border-radius:14px;
        background:rgba(229,57,53,0.10);
        border:1px solid rgba(229,57,53,0.25);
        color:var(--danger);
        font-size:13px;
        line-height:1.45;

    `;


    error.innerHTML = `

        <i class="ph ph-warning-circle"></i>
        ${escapeHTML(message)}

    `;


    viewport
        .firstElementChild
        ?.appendChild(error);


    setTimeout(
        () => {

            if (
                error.parentNode
            ) {

                error.remove();

            }

        },
        3500
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   HOME
========================================================= */

function goHome() {

    window.location.href =
        "/";

}


/* =========================================================
   INITIALIZE
========================================================= */

renderStep(
    "next",
    false
);


/* =========================================================
   SPINNER
========================================================= */

const spinnerStyle =
    document.createElement(
        "style"
    );


spinnerStyle.textContent = `

    @keyframes spin {

        from {
            transform:rotate(0deg);
        }

        to {
            transform:rotate(360deg);
        }

    }

`;


document.head.appendChild(
    spinnerStyle
);

</script>
