<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Get Verified • Appnetick</title>

<link
    rel="icon"
    href="/20260313_121958.jpg"
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-secondary:#F7F7F7;

    --text:#212121;
    --secondary:#757575;
    --muted:#9E9E9E;

    --border:#DCDCDC;

    --input-bg:#F5F5F5;

    --primary:#2979FF;
    --primary-soft:rgba(41,121,255,0.10);

    --danger:#E53935;
    --success:#2E7D32;

    --shadow:
        0 8px 30px rgba(0,0,0,0.06);

    --radius:18px;

    --button-radius:30px;
}


/* =========================================================
   DARK THEME
========================================================= */

html[data-theme="dark"] {

    --bg:#1E1E1E;
    --surface:#1E1E1E;
    --surface-secondary:#252525;

    --text:#FFFFFF;
    --secondary:#A0A0A0;
    --muted:#777777;

    --border:#424242;

    --input-bg:#252525;

    --primary:#2979FF;
    --primary-soft:rgba(41,121,255,0.14);

    --danger:#EF5350;
    --success:#66BB6A;

    --shadow:
        0 8px 30px rgba(0,0,0,0.22);
}


/* =========================================================
   GLOBAL
========================================================= */

* {

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:'Inter',sans-serif;

    -webkit-tap-highlight-color:transparent;
}


html {

    scroll-behavior:smooth;
}


body {

    margin:0;
    padding:0;

    width:100%;
    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    overflow-x:hidden;

    transition:
        background .25s ease,
        color .25s ease;
}


button,
input,
textarea,
select {

    font-family:inherit;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {

    height:64px;

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 12px 0 8px;

    position:sticky;

    top:0;

    z-index:1000;

    background:var(--surface);

    border-bottom:1px solid var(--border);
}


.toolbar-left {

    display:flex;

    align-items:center;

    gap:4px;
}


.brand {

    font-size:20px;

    font-weight:700;

    letter-spacing:-.4px;
}


.toolbar-actions {

    display:flex;

    align-items:center;

    gap:4px;
}


.icon-btn {

    width:44px;
    height:44px;

    border:0;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent;

    color:var(--text);

    cursor:pointer;

    font-size:22px;

    outline:none;

    -webkit-appearance:none;

    appearance:none;

    box-shadow:none;
}


.icon-btn:focus,
.icon-btn:focus-visible {

    outline:none;

    box-shadow:none;
}


.icon-btn:active {

    transform:scale(.92);
}


#toolbarBack {

    visibility:hidden;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:24px 20px 40px;

    min-height:
        calc(100vh - 64px);

    display:flex;

    flex-direction:column;
}


/* =========================================================
   FORM AREA
========================================================= */

.progress-area {

    width:100%;

    max-width:430px;

    margin:0 auto 28px;
}


.progress-top {

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;
}


.progress-label {

    font-size:13px;

    font-weight:600;

    color:var(--secondary);
}


.progress-number {

    font-size:13px;

    color:var(--muted);

    font-weight:500;
}


.progress-track {

    width:100%;

    height:5px;

    border-radius:999px;

    overflow:hidden;

    background:var(--surface-secondary);
}


.progress-fill {

    height:100%;

    width:5%;

    border-radius:999px;

    background:var(--primary);

    transition:width .3s ease;
}


.step-viewport {

    width:100%;

    max-width:430px;

    margin:0 auto;

    position:relative;

    overflow:hidden;

    flex:1;
}


.step {

    width:100%;
}


.slide-next-enter {

    animation:
        slideNextEnter .30s
        cubic-bezier(.22,1,.36,1)
        both;
}


.slide-back-enter {

    animation:
        slideBackEnter .30s
        cubic-bezier(.22,1,.36,1)
        both;
}


@keyframes slideNextEnter {

    from {

        opacity:0;

        transform:
            translate3d(100%,0,0);

    }

    to {

        opacity:1;

        transform:
            translate3d(0,0,0);

    }

}


@keyframes slideBackEnter {

    from {

        opacity:0;

        transform:
            translate3d(-100%,0,0);

    }

    to {

        opacity:1;

        transform:
            translate3d(0,0,0);

    }

}


/* =========================================================
   INTRO
========================================================= */

.intro-icon {

    width:82px;
    height:82px;

    border-radius:25px;

    margin:8px auto 24px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:var(--primary-soft);

    color:var(--primary);

    font-size:42px;
}


.step-title {

    margin:0 0 10px;

    font-size:25px;

    line-height:1.22;

    font-weight:700;

    letter-spacing:-.5px;
}


.step-description {

    margin:0;

    color:var(--secondary);

    font-size:15px;

    line-height:1.65;
}


.intro-points {

    margin-top:26px;

    display:flex;

    flex-direction:column;

    gap:11px;
}


.intro-point {

    display:flex;

    align-items:flex-start;

    gap:12px;

    padding:14px;

    border-radius:16px;

    background:var(--surface-secondary);

    border:1px solid var(--border);
}


.intro-point-icon {

    width:36px;
    height:36px;

    flex:0 0 36px;

    border-radius:11px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--primary);

    background:var(--primary-soft);

    font-size:19px;
}


.intro-point-text {

    font-size:13px;

    line-height:1.5;

    color:var(--secondary);
}


.intro-point-text strong {

    display:block;

    color:var(--text);

    margin-bottom:3px;

    font-size:14px;
}


/* =========================================================
   QUESTIONS
========================================================= */

.question-label {

    display:block;

    margin:5px 0 9px;

    font-size:20px;

    font-weight:700;

    line-height:1.35;
}


.question-help {

    margin:0 0 20px;

    color:var(--secondary);

    font-size:14px;

    line-height:1.55;
}


/* =========================================================
   INPUTS
   NO INPUT ICONS
========================================================= */

.input-wrap {

    position:relative;

    width:100%;
}


.form-input,
.form-textarea {

    width:100%;

    border:1px solid var(--border);

    outline:none;

    color:var(--text);

    background:var(--input-bg);

    border-radius:16px;

    font-size:15px;

    transition:
        border .2s ease,
        box-shadow .2s ease;

    -webkit-appearance:none;

    appearance:none;
}


.form-input {

    min-height:54px;

    padding:0 16px;
}


.form-textarea {

    min-height:135px;

    padding:16px;

    resize:none;

    line-height:1.55;
}


.form-input:focus,
.form-textarea:focus {

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        var(--primary-soft);
}


.form-input::placeholder,
.form-textarea::placeholder {

    color:var(--muted);
}


/* =========================================================
   CHIPS
========================================================= */

.chips {

    display:flex;

    flex-wrap:wrap;

    gap:9px;
}


.chip {

    border:1px solid var(--border);

    background:var(--surface);

    color:var(--secondary);

    border-radius:999px;

    padding:11px 15px;

    font-size:13px;

    font-weight:500;

    cursor:pointer;

    outline:none;

    -webkit-appearance:none;

    appearance:none;
}


.chip.selected {

    background:var(--primary-soft);

    color:var(--primary);

    border-color:var(--primary);
}


/* =========================================================
   CONFIRM
========================================================= */

.confirm-box {

    padding:17px;

    border-radius:17px;

    border:1px solid var(--border);

    background:var(--surface-secondary);

    cursor:pointer;
}


.confirm-row {

    display:flex;

    align-items:flex-start;

    gap:12px;
}


.custom-check {

    width:22px;
    height:22px;

    flex:0 0 22px;

    border-radius:7px;

    border:1.5px solid var(--muted);

    display:flex;

    align-items:center;
    justify-content:center;

    color:#FFFFFF;

    font-size:15px;
}


.custom-check i {

    opacity:0;
}


.confirm-box.checked .custom-check {

    border-color:var(--primary);

    background:var(--primary);
}


.confirm-box.checked .custom-check i {

    opacity:1;
}


.confirm-text {

    color:var(--secondary);

    font-size:13px;

    line-height:1.55;
}


/* =========================================================
   BOTTOM ACTIONS
========================================================= */

.bottom-actions {

    width:100%;

    max-width:430px;

    margin:18px auto 0;

    display:flex;
}


/* =========================================================
   APPNETICK PRIMARY BUTTON
   SAME VISUAL STYLE AS HOME PAGE
   NO ICON
========================================================= */

.next-button {

    width:100%;

    min-height:42px;

    height:42px;

    padding:0 18px;

    border:0;

    border-radius:30px;

    background:#2979FF;

    color:#FFFFFF;

    font-size:14px;

    font-weight:600;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    cursor:pointer;

    outline:none;

    box-shadow:none;

    -webkit-appearance:none;

    appearance:none;

    overflow:hidden;

    transition:
        transform .15s ease,
        opacity .15s ease;
}


.next-button:hover {

    opacity:.88;

    transform:translateY(-1px);
}


.next-button:active {

    transform:scale(.985);
}


.next-button:focus,
.next-button:focus-visible {

    outline:none;

    box-shadow:none;
}


.next-button:disabled {

    cursor:not-allowed;

}


/* =========================================================
   BUTTON TEXT
========================================================= */

#nextText {

    display:block;

    line-height:1;

    position:relative;

    z-index:2;
}


/* =========================================================
   BUTTON LOADING
   MEDIUM WHITE ROUNDED PROGRESS BAR
========================================================= */

.button-loader {

    display:none;

    width:96px;

    height:6px;

    border-radius:999px;

    overflow:hidden;

    background:rgba(255,255,255,.28);

    position:relative;

    z-index:3;

    flex:0 0 auto;
}


.button-loader-fill {

    position:absolute;

    left:0;

    top:0;

    width:0%;

    height:100%;

    border-radius:999px;

    background:#FFFFFF;

    transition:
        width 3s linear;
}


.next-button.loading {

    pointer-events:none;

    opacity:1;

    transform:none;
}


.next-button.loading #nextText {

    display:none;
}


.next-button.loading .button-loader {

    display:block;
}


/* =========================================================
   USER PREVIEW
========================================================= */

.user-preview {

    margin-top:18px;

    padding:15px;

    border:1px solid var(--border);

    border-radius:18px;

    background:var(--surface-secondary);

    cursor:pointer;

    transition:
        border-color .2s ease,
        background .2s ease,
        transform .15s ease;
}


.user-preview.selected {

    border-color:var(--primary);

    background:var(--primary-soft);
}


.user-preview:active {

    transform:scale(.99);
}


.user-preview-main {

    display:flex;

    align-items:center;

    gap:12px;
}


.user-avatar {

    width:52px;
    height:52px;

    border-radius:50%;

    object-fit:cover;

    background:var(--input-bg);
}


.user-preview-name {

    font-size:15px;

    font-weight:600;

    color:var(--text);
}


.user-preview-username {

    margin-top:3px;

    font-size:13px;

    color:var(--secondary);
}


.verified-badge {

    display:inline-flex;

    align-items:center;

    gap:4px;

    margin-top:7px;

    padding:4px 8px;

    border-radius:999px;

    background:var(--primary-soft);

    color:var(--primary);

    font-size:11px;

    font-weight:600;
}


/* =========================================================
   ACCOUNT SELECTION MESSAGE
========================================================= */

.account-confirm-hint {

    margin-top:10px;

    color:var(--secondary);

    font-size:12px;

    line-height:1.5;

    text-align:center;

    display:none;
}


.account-confirm-hint.visible {

    display:block;
}


/* =========================================================
   STATUS
========================================================= */

.status-card {

    margin-top:16px;

    padding:15px;

    border-radius:16px;

    background:var(--surface-secondary);

    border:1px solid var(--border);

    display:flex;

    align-items:flex-start;

    gap:10px;
}


.status-card i {

    color:var(--primary);

    font-size:20px;
}


.status-card span {

    color:var(--secondary);

    font-size:13px;

    line-height:1.5;
}


.status-card.success i {

    color:var(--success);
}


/* =========================================================
   REVIEW
========================================================= */

.review-card {

    border:1px solid var(--border);

    background:var(--surface-secondary);

    border-radius:18px;

    overflow:hidden;
}


.review-row {

    padding:13px 15px;

    border-bottom:1px solid var(--border);
}


.review-row:last-child {

    border-bottom:0;
}


.review-label {

    font-size:11px;

    color:var(--muted);

    margin-bottom:4px;

    text-transform:uppercase;

    letter-spacing:.5px;

    font-weight:600;
}


.review-value {

    font-size:14px;

    color:var(--text);

    line-height:1.45;

    word-break:break-word;
}


.info-card {

    margin-top:16px;

    padding:14px;

    border-radius:16px;

    background:var(--surface-secondary);

    border:1px solid var(--border);

    display:flex;

    gap:10px;

    align-items:flex-start;
}


.info-card i {

    color:var(--primary);

    font-size:19px;
}


.info-card span {

    color:var(--secondary);

    font-size:12px;

    line-height:1.55;
}


/* =========================================================
   SUCCESS
========================================================= */

.success {

    text-align:center;

    padding-top:35px;
}


.success-icon {

    width:86px;
    height:86px;

    margin:0 auto 24px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--primary);

    background:var(--primary-soft);

    font-size:44px;
}


.success h2 {

    margin:0 0 10px;

    font-size:25px;
}


.success p {

    margin:0;

    color:var(--secondary);

    font-size:14px;

    line-height:1.65;
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width:701px) {

    .toolbar {

        height:68px;

        padding:0 24px;
    }

        max-width:900px;

        padding:

    }


    .progress-area {

        max-width:560px;

        margin-bottom:34px;
    }


    .step-viewport {

        max-width:560px;
    }


    .bottom-actions {

        margin-top:26px;
    }


    .step-title {

        font-size:28px;
    }


    .question-label {

        font-size:22px;
    }


    .form-input {

        min-height:56px;
    }


    .next-button {

        min-height:42px;

        height:42px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px) {

    .toolbar {

        height:62px;

        padding:0 14px;
    }


    .brand {

        font-size:21px;
    }


    .page {

        max-width:430px;

        padding:
            24px
            14px
            30px;
    }


    .progress-area {

        margin-bottom:28px;
    }


    .step-viewport {

        max-width:430px;
    }


    .bottom-actions {

        max-width:430px;
    }


    .step-title {

        font-size:25px;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width:400px) {

    .page {

        padding-left:16px;

        padding-right:16px;
    }


    .step-title {

        font-size:23px;
    }

    }

        width:92px;

    }

}

</style>

</head>

<body>


<!-- =====================================================
     TOOLBAR
===================================================== -->

<header class="toolbar">

    <div class="toolbar-left">

        <button
            class="icon-btn"
            id="toolbarBack"
            type="button"
            onclick="previousStep()"
            aria-label="Back"
        >

            <i class="ph ph-arrow-left"></i>

        </button>


        <div class="brand">
            Appnetick.
        </div>

    </div>


    <div class="toolbar-actions">

        <button
            class="icon-btn"
            id="themeButton"
            type="button"
            aria-label="Change theme"
        >

            <i class="ph ph-moon"></i>

        </button>


        <button
            class="icon-btn"
            type="button"
            onclick="goHome()"
            aria-label="Home"
        >

            <i class="ph ph-house"></i>

        </button>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">


    <div class="progress-area">

        <div class="progress-top">

            <span
                class="progress-label"
                id="progressLabel"
            >
                Verification
            </span>


            <span
                class="progress-number"
                id="progressNumber"
            >
                1 of 20
            </span>

        </div>


        <div class="progress-track">

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>

    </div>


    <div
        class="step-viewport"
        id="stepViewport"
    ></div>


    <div
        class="bottom-actions"
        id="bottomActions"
    >

        <button
            class="next-button"
            id="nextButton"
            type="button"
            onclick="nextStep()"
        >

            <span id="nextText">
                Get started
            </span>


            <div
                class="button-loader"
                id="buttonLoader"
            >

                <div
                    class="button-loader-fill"
                    id="buttonLoaderFill"
                ></div>

            </div>

        </button>

    </div>

</main>


<script>

/* =========================================================
   API
========================================================= */

const API_BASE =
    "https://api-appnetick.vercel.app";


/* =========================================================
   THEME
========================================================= */

const themeButton =
    document.getElementById(
        "themeButton"
    );


const themeIcon =
    document.getElementById(
        "themeButton"
    ).querySelector("i");


const systemDark =
    window.matchMedia &&
    window.matchMedia(
        "(prefers-color-scheme: dark)"
    ).matches;


let savedTheme =
    localStorage.getItem(
        "appnetick-theme"
    );


if (!savedTheme) {

    savedTheme =
        systemDark
            ? "dark"
            : "light";

}


applyTheme(savedTheme);


function applyTheme(theme) {

    document.documentElement
        .setAttribute(
            "data-theme",
            theme
        );


    localStorage.setItem(
        "appnetick-theme",
        theme
    );


    themeIcon.className =
        theme === "dark"
            ? "ph ph-sun"
            : "ph ph-moon";

}


themeButton.addEventListener(
    "click",
    function() {

        const current =
            document.documentElement
                .getAttribute(
                    "data-theme"
                );


        applyTheme(
            current === "dark"
                ? "light"
                : "dark"
        );

    }
);


/* =========================================================
   FORM DATA
========================================================= */

const formData = {

    uid:"",
    username:"",
    fullName:"",
    email:"",

    legalName:"",
    dateOfBirth:"",

    country:"",
    phone:"",

    accountCategory:"",
    profession:"",

    verificationReason:"",
    knownFor:"",

    website:"",
    socialProfile:"",

    audience:"",
    contentCategory:"",

    achievement:"",
    publicPresence:"",

    authenticityConfirmed:false,
    informationConfirmed:false,
    termsConfirmed:false

};


let usernameChecked = false;

let usernameCheckInProgress = false;

let foundUser = null;

let accountSelected = false;


/* =========================================================
   STEPS
========================================================= */

const steps = [

    { type:"intro" },

    { type:"username" },

    {
        type:"input",
        key:"legalName",
        title:"What is your legal name?",
        help:"Enter your full legal name exactly as it appears on your official records.",
        placeholder:"Enter your legal name"
    },

    {
        type:"date",
        key:"dateOfBirth",
        title:"What is your date of birth?",
        help:"Your date of birth helps us establish that the account belongs to a real person."
    },

    {
        type:"chips",
        key:"country",
        title:"Where are you based?",
        help:"Select the country that best represents your current primary location.",
        options:[
            "India",
            "United States",
            "United Kingdom",
            "Canada",
            "Australia",
            "UAE",
            "Other"
        ]
    },

    {
        type:"input",
        key:"phone",
        title:"What is your phone number?",
        help:"Use a phone number that you control.",
        placeholder:"+91 XXXXX XXXXX",
        inputType:"tel"
    },

    {
        type:"chips",
        key:"accountCategory",
        title:"What best describes your account?",
        help:"Choose the category that most accurately represents your public presence.",
        options:[
            "Creator",
            "Public Figure",
            "Artist",
            "Musician",
            "Business",
            "Brand",
            "Professional",
            "Organization",
            "Community",
            "Other"
        ]
    },

    {
        type:"input",
        key:"profession",
        title:"What is your profession or role?",
        help:"Tell us what you currently do publicly or professionally.",
        placeholder:"Example: Photographer"

        steps[currentStep];

    element.className =

    element.innerHTML =
        getStepHTML(step);


    if (animate) {

    viewport.replaceChildren(
        element

    restoreFieldValue();

    updateProgress();

    updateButtons();

    updateToolbar();

/* =========================================================

========================================================= */

function setupUsernameStep() {

    const input =
        document.getElementById(
            "usernameInput"
        );


    if (!input) return;


    input.value =
        formData.username || "";


    input.addEventListener(
        "input",
        function() {

            formData.username =
                normalizeUsername(
                    input.value
                );


            usernameChecked =
                false;


            foundUser =
                null;


            accountSelected =
                false;


            formData.uid = "";

            formData.fullName = "";

            formData.email = "";


            renderUsernameStatus();

            updateButtons();

        }
    );


    renderUsernameStatus();

}


/* =========================================================
   NORMALIZE USERNAME
========================================================= */

function normalizeUsername(value) {

    return String(value || "")
        .trim()
        .replace(/^@+/, "")
        .toLowerCase();

}


/* =========================================================
   CHECK USERNAME
========================================================= */

async function checkUsername() {

    const username =
        normalizeUsername(
            formData.username
        );


    if (!username) {

        showError(
            "Please enter your Appnetick username."
        );

        return false;

    }


    usernameCheckInProgress =
        true;


    updateButtons();


    renderTemporaryStatus(
        "Checking username..."
    );


    try {

        const response =
            await fetch(
                `${API_BASE}/api/verification?action=check-username&username=${encodeURIComponent(username)}`,
                {
                    method:"GET",
                    headers:{
                        "Accept":"application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to check username."
            );

        }


        if (!data.exists) {

            usernameChecked =
                false;

            foundUser =
                null;

            accountSelected =
                false;

            renderUsernameNotFound();

            return false;

        }


        foundUser =
            data.user || null;


        formData.uid =
            data.user.uid || "";


        formData.username =
            data.user.username || username;


        formData.fullName =
            data.user.full_name || "";


        formData.email =
            data.user.email || "";


        usernameChecked =
            true;


        accountSelected =
            false;


        if (data.verification) {

            showExistingVerification(
                data.verification
            );

            return false;

        }


        renderUsernameUser();


        return true;

    } catch(error) {

        console.error(
            "Username check:",
            error
        );


        usernameChecked =
            false;


        showError(
            "Unable to check this username. Please try again."
        );


        return false;

    } finally {

        usernameCheckInProgress =
            false;


        updateButtons();

    }

}

/* =========================================================
   CHIP
========================================================= */

function selectChip(element) {

    document
        .querySelectorAll(".chip")
        .forEach(
            chip =>
                chip.classList.remove(
                    "selected"
                )
        );


    element.classList.add(
        "selected"
    );


    formData[
        steps[currentStep].key
    ] =
        element.dataset.value;


    updateButtons();

}


/* =========================================================
   CONFIRM
========================================================= */

function toggleConfirm() {

    const box =
        document.getElementById(
            "confirmBox"
        );


    if (!box) return;


    const key =
        steps[currentStep].key;


    formData[key] =
        !formData[key];


    box.classList.toggle(
        "checked",
        formData[key]
    );


    updateButtons();

}


/* =========================================================
   SAVE CURRENT VALUE
========================================================= */

function saveCurrentValue() {

    const step =
        steps[currentStep];


    if (
        step.type === "input" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        const input =
            document.getElementById(
                "currentInput"
            );


        if (input) {

            formData[step.key] =
                input.value.trim();

        }

    }


    if (step.type === "username") {

        const input =
            document.getElementById(
                "usernameInput"
            );


        if (input) {

            formData.username =
                normalizeUsername(
                    input.value
                );

        }

    }

}


/* =========================================================
   RESTORE
========================================================= */

function restoreFieldValue() {

    const step =
        steps[currentStep];


    if (
        step.type === "input" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        const input =
            document.getElementById(
                "currentInput"
            );


        if (input) {

            input.value =
                formData[step.key] || "";

        }

    }


    if (step.type === "chips") {

        const selected =
            formData[step.key];


        if (!selected) return;


        document
            .querySelectorAll(".chip")
            .forEach(
                chip => {

                    if (
                        chip.dataset.value ===
                        selected
                    ) {

                        chip.classList.add(
                            "selected"
                        );

                    }

                }
            );

    }


    if (step.type === "confirm") {

        const box =
            document.getElementById(
                "confirmBox"
            );


        if (
            box &&
            formData[step.key]
        ) {

            box.classList.add(
                "checked"
            );

        }

    }

}


/* =========================================================
   VALIDATION
========================================================= */

function validateCurrentStep() {

    const step =
        steps[currentStep];


    if (step.type === "intro") {

        return true;

    }


    if (step.type === "username") {

        saveCurrentValue();


        if (!formData.username) {

            showError(
                "Please enter your username."
            );

            return false;

        }


        if (!usernameChecked) {

            showError(
                "Please check your username before continuing."
            );

            return false;

        }


        if (!accountSelected) {

            showError(
                "Please select the account shown above if this is your account."
            );

            return false;

        }


        return true;

    }


    if (
        step.type === "input" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        saveCurrentValue();


        if (
            !formData[step.key] &&
            !step.optional
        ) {

            showError(
                "Please enter this information before continuing."
            );

            return false;

        }

    }


    if (step.type === "chips") {

        if (!formData[step.key]) {

            showError(
                "Please select one option to continue."
            );

            return false;

        }

    }


    if (step.type === "confirm") {

        if (!formData[step.key]) {

            showError(
                "Please confirm this before continuing."
            );

            return false;

        }

    }


    return true;

}


/* =========================================================
   BUTTON 3 SECOND LOADING
========================================================= */

function startButtonProgress() {

    return new Promise(
        resolve => {

            nextButton.classList.add(
                "loading"
            );


            nextButton.disabled =
                true;


            buttonLoaderFill.style.transition =
                "none";


            buttonLoaderFill.style.width =
                "0%";


            requestAnimationFrame(
                () => {

                    requestAnimationFrame(
                        () => {

                            buttonLoaderFill.style.transition =
                                "width 3s linear";


                            buttonLoaderFill.style.width =
                                "100%";

                        }
                    );

                }
            );


            setTimeout(
                () => {

                    nextButton.classList.remove(
                        "loading"
                    );


                    buttonLoaderFill.style.transition =
                        "none";


                    buttonLoaderFill.style.width =
                        "0%";


                    nextButton.disabled =
                        false;


                    resolve();

                },
                3000
            );

        }
    );

}


/* =========================================================
   NEXT
========================================================= */

async function nextStep() {

    if (isAnimating) return;


    if (
        currentStep === 1 &&
        !usernameChecked
    ) {

        const success =
            await checkUsername();


        if (!success) return;


        return;

    }


    if (!validateCurrentStep()) return;


    if (
        currentStep >=
        steps.length - 1
    ) {

        submitVerification();

        return;

    }


    isAnimating =
        true;


    saveCurrentValue();


    await startButtonProgress();


    currentStep++;


    renderStep(
        "next",
        true
    );


    setTimeout(
        () => {

            isAnimating =
                false;

        },
        320
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousStep() {

    if (isAnimating) return;


    if (currentStep <= 0) {

        goHome();

        return;

    }


    saveCurrentValue();


    isAnimating =
        true;


    currentStep--;


    if (currentStep !== 1) {

        accountSelected =
            false;

    }


    renderStep(
        "back",
        true
    );


    setTimeout(
        () => {

            isAnimating =
                false;

        },
        320
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   TOOLBAR
========================================================= */

function updateToolbar() {

    /*
       Back button is intentionally visible
       even on the first introduction page.
    */

    toolbarBack.style.visibility =
        "visible";

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const total =
        steps.length;


    const number =
        currentStep + 1;


    const percentage =
        (number / total) * 100;


    progressNumber.textContent =
        `${number} of ${total}`;


    progressFill.style.width =
        `${percentage}%`;


    if (currentStep === 0) {

        progressLabel.textContent =
            "Verification";

    } else if (
        currentStep === total - 1
    ) {

        progressLabel.textContent =
            "Review";

    } else {

        progressLabel.textContent =
            "Application";

    }

}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons() {

    nextButton.style.display =
        "flex";


    nextButton.disabled =
        false;


    nextButton.classList.remove(
        "loading"
    );


    buttonLoaderFill.style.transition =
        "none";


    buttonLoaderFill.style.width =
        "0%";


    if (currentStep === 0) {

        nextText.textContent =
            "Get started";

        return;

    }


    if (currentStep === 1) {

        if (usernameCheckInProgress) {

            nextText.textContent =
                "Checking...";


            nextButton.disabled =
                true;

        } else if (
            usernameChecked &&
            accountSelected
        ) {

            nextText.textContent =
                "Continue";

        } else {

            nextText.textContent =
                "Check username";

        }


        return;

    }


    if (
        currentStep ===
        steps.length - 1
    ) {

        nextText.textContent =
            "Submit application";


        return;

    }


    nextText.textContent =
        "Continue";

}

            ${reviewRow(

            )}

            )}

/* =========================================================
   REVIEW ROW
========================================================= */

function reviewRow(
    label,
    value
) {

    return `

        <div class="review-row">

            <div class="review-label">

                ${escapeHTML(label)}

            </div>


            <div class="review-value">

                ${escapeHTML(
                    value ||
                    "Not provided"
                )}

            </div>

        </div>

    `;

}


/* =========================================================
   SUBMIT
========================================================= */

async function submitVerification() {

    if (isAnimating) return;


    saveCurrentValue();


    nextButton.disabled =
        true;


    nextText.textContent =
        "Submitting...";


    const payload = {

        uid:formData.uid,

        username:formData.username,

        full_name:formData.fullName,

        legal_name:formData.legalName,

        email:formData.email,

        date_of_birth:formData.dateOfBirth,

        country:formData.country,

        phone:formData.phone,

        account_category:formData.accountCategory,

        profession:formData.profession,

        verification_reason:
            formData.verificationReason,

        known_for:
            formData.knownFor,

        website:
            formData.website,

        social_profile:
            formData.socialProfile,

        audience:
            formData.audience,

        content_category:
            formData.contentCategory,

        achievement:
            formData.achievement,

        public_presence:
            formData.publicPresence,

        authenticity_confirmed:
            formData.authenticityConfirmed,

        information_confirmed:
            formData.informationConfirmed,

        terms_confirmed:
            formData.termsConfirmed

    };


    try {

        const response =
            await fetch(
                `${API_BASE}/api/verification?action=submit`,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify(payload)

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            if (
                data.code ===
                "ALREADY_VERIFIED"
            ) {

                showExistingVerification({
                    verification_status:
                        "approved"
                });

                return;

            }


            if (
                data.code ===
                "ALREADY_PENDING"
            ) {

                showExistingVerification({
                    verification_status:
                        "pending"
                });

                return;

            }


            throw new Error(
                data.error ||
                "Unable to submit application."
            );

        }


        showSuccess();

    } catch(error) {

        console.error(
            "Verification submit:",
            error
        );


        nextButton.disabled =
            false;


        nextText.textContent =
            "Submit application";


        showError(
            error.message ||
            "Something went wrong. Please try again."
        );

    }

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess() {

    document.getElementById(
        "bottomActions"
    ).style.display =
        "none";


    toolbarBack.style.visibility =
        "visible";


    progressLabel.textContent =
        "Submitted";


    progressNumber.textContent =
        "Complete";


    progressFill.style.width =
        "100%";


    viewport.replaceChildren(

        (() => {

            const div =
                document.createElement("div");


            div.className =
                "step";


            div.innerHTML = `

                <div class="success">

                    <div class="success-icon">

                        <i class="ph ph-check"></i>

                    </div>


                    <h2>

                        Application submitted

                    </h2>


                    <p>

                        Your verification request has been
                        submitted successfully.

                        <br><br>

                        Appnetick will review the information
                        provided and update the verification
                        status when the review is complete.

                    </p>

                </div>

            `;


            return div;

        })()

    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    let existing =
        document.getElementById(
            "formError"
        );


    if (existing) {

        existing.remove();

    }


    const error =
        document.createElement("div");


    error.id =
        "formError";


    error.style.cssText = `

        margin-top:14px;
        padding:12px 14px;
        border-radius:14px;
        background:rgba(229,57,53,0.10);
        border:1px solid rgba(229,57,53,0.25);
        color:var(--danger);
        font-size:13px;
        line-height:1.45;

    `;


    error.innerHTML = `

        <i class="ph ph-warning-circle"></i>

        ${escapeHTML(message)}

    `;


    viewport
        .firstElementChild
        ?.appendChild(error);


    setTimeout(
        () => {

            if (error.parentNode) {

                error.remove();

            }

        },
        3500
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   HOME
========================================================= */

function goHome() {

    window.location.href =
        "/";

}


/* =========================================================
   INITIAL RENDER
========================================================= */

renderStep(
    "next",
    false
);

</script>
