<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Get Verified • Appnetick</title>

<link
    rel="icon"
    href="/20260313_121958.jpg"
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-secondary:#F7F7F7;

    --text:#212121;
    --secondary:#757575;
    --muted:#9E9E9E;

    --border:#DCDCDC;
    --input-bg:#F5F5F5;

    --primary:#2979FF;
    --primary-soft:rgba(41,121,255,0.10);

    --danger:#E53935;
    --success:#2E7D32;

    --shadow:
        0 8px 30px rgba(0,0,0,0.06);

    --radius:18px;
    --button-radius:30px;
}


/* =========================================================
   DARK THEME
========================================================= */

html[data-theme="dark"] {

    --bg:#1E1E1E;
    --surface:#1E1E1E;
    --surface-secondary:#252525;

    --text:#FFFFFF;
    --secondary:#A0A0A0;
    --muted:#777777;

    --border:#424242;
    --input-bg:#252525;

    --primary:#2979FF;
    --primary-soft:rgba(41,121,255,0.14);

    --danger:#EF5350;
    --success:#66BB6A;

    --shadow:
        0 8px 30px rgba(0,0,0,0.22);
}


/* =========================================================
   GLOBAL
========================================================= */

* {

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:'Inter',sans-serif;

    -webkit-tap-highlight-color:transparent;
}

html {

    scroll-behavior:smooth;
}

body {

    margin:0;
    padding:0;

    width:100%;
    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    overflow-x:hidden;

    transition:
        background .25s ease,
        color .25s ease;
}

button,
input,
textarea,
select {

    font-family:inherit;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {

    height:64px;
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px 0 8px;

    position:sticky;
    top:0;

    z-index:1000;

    background:var(--surface);

    border-bottom:1px solid var(--border);
}

.toolbar-left {

    display:flex;
    align-items:center;

    gap:4px;
}

.brand {

    font-size:20px;
    font-weight:700;

    letter-spacing:-.4px;
}

.toolbar-actions {

    display:flex;
    align-items:center;

    gap:4px;
}

.icon-btn {

    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:transparent;

    color:var(--text);

    cursor:pointer;

    font-size:22px;

    outline:none;

    -webkit-appearance:none;
    appearance:none;

    box-shadow:none;
}

.icon-btn:focus,
.icon-btn:focus-visible {

    outline:none;
    box-shadow:none;
}

.icon-btn:active {

    transform:scale(.92);
}

#toolbarBack {

    visibility:hidden;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:24px 20px 40px;

    min-height:
        calc(100vh - 64px);

    display:flex;

    flex-direction:column;
}


/* =========================================================
   FORM AREA
========================================================= */

.progress-area {

    width:100%;

    max-width:430px;

    margin:0 auto 28px;
}

.progress-top {

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;
}

.progress-label {

    font-size:13px;

    font-weight:600;

    color:var(--secondary);
}

.progress-number {

    font-size:13px;

    color:var(--muted);

    font-weight:500;
}

.progress-track {

    width:100%;

    height:5px;

    border-radius:999px;

    overflow:hidden;

    background:var(--surface-secondary);
}

.progress-fill {

    height:100%;

    width:4.76%;

    border-radius:999px;

    background:var(--primary);

    transition:width .3s ease;
}

.step-viewport {

    width:100%;

    max-width:430px;

    margin:0 auto;

    position:relative;

    overflow:hidden;

    flex:none;
}

.step {

    width:100%;
}

.slide-next-enter {

    animation:
        slideNextEnter .30s
        cubic-bezier(.22,1,.36,1)
        both;
}

.slide-back-enter {

    animation:
        slideBackEnter .30s
        cubic-bezier(.22,1,.36,1)
        both;
}

@keyframes slideNextEnter {

    from {

        opacity:0;

        transform:
            translate3d(100%,0,0);
    }

    to {

        opacity:1;

        transform:
            translate3d(0,0,0);
    }
}

@keyframes slideBackEnter {

    from {

        opacity:0;

        transform:
            translate3d(-100%,0,0);
    }

    to {

        opacity:1;

        transform:
            translate3d(0,0,0);
    }
}


/* =========================================================
   INTRO
========================================================= */

.intro-icon {

    width:82px;
    height:82px;

    border-radius:25px;

    margin:8px auto 24px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:var(--primary-soft);

    color:var(--primary);

    font-size:42px;
}

.step-title {

    margin:0 0 10px;

    font-size:25px;

    line-height:1.22;

    font-weight:700;

    letter-spacing:-.5px;
}

.step-description {

    margin:0;

    color:var(--secondary);

    font-size:15px;

    line-height:1.65;
}

.intro-points {

    margin-top:26px;

    display:flex;

    flex-direction:column;

    gap:11px;
}

.intro-point {

    display:flex;

    align-items:flex-start;

    gap:12px;

    padding:14px;

    border-radius:16px;

    background:var(--surface-secondary);

    border:1px solid var(--border);
}

.intro-point-icon {

    width:36px;
    height:36px;

    flex:0 0 36px;

    border-radius:11px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--primary);

    background:var(--primary-soft);

    font-size:19px;
}

.intro-point-text {

    font-size:13px;

    line-height:1.5;

    color:var(--secondary);
}

.intro-point-text strong {

    display:block;

    color:var(--text);

    margin-bottom:3px;

    font-size:14px;
}


/* =========================================================
   QUESTIONS
========================================================= */

.question-label {

    display:block;

    margin:5px 0 9px;

    font-size:20px;

    font-weight:700;

    line-height:1.35;
}

.question-help {

    margin:0 0 20px;

    color:var(--secondary);

    font-size:14px;

    line-height:1.55;
}


/* =========================================================
   INPUTS
========================================================= */

.input-wrap {

    position:relative;

    width:100%;
}

.form-input,
.form-textarea {

    width:100%;

    border:1px solid var(--border);

    outline:none;

    color:var(--text);

    background:var(--input-bg);

    border-radius:16px;

    font-size:15px;

    transition:
        border .2s ease,
        box-shadow .2s ease;

    -webkit-appearance:none;
    appearance:none;
}

.form-input {

    min-height:54px;

    padding:0 16px;
}

.form-textarea {

    min-height:135px;

    padding:16px;

    resize:none;

    line-height:1.55;
}

.form-input:focus,
.form-textarea:focus {

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        var(--primary-soft);
}

.form-input::placeholder,
.form-textarea::placeholder {

    color:var(--muted);
}


/* =========================================================
   CHIPS
========================================================= */

.chips {

    display:flex;

    flex-wrap:wrap;

    gap:9px;
}

.chip {

    border:1px solid var(--border);

    background:var(--surface);

    color:var(--secondary);

    border-radius:999px;

    padding:11px 15px;

    font-size:13px;

    font-weight:500;

    cursor:pointer;

    outline:none;

    -webkit-appearance:none;

    appearance:none;
}

.chip.selected {

    background:var(--primary-soft);

    color:var(--primary);

    border-color:var(--primary);
}


/* =========================================================
   CONFIRM
========================================================= */

.confirm-box {

    padding:17px;

    border-radius:17px;

    border:1px solid var(--border);

    background:var(--surface-secondary);

    cursor:pointer;
}

.confirm-row {

    display:flex;

    align-items:flex-start;

    gap:12px;
}

.custom-check {

    width:22px;
    height:22px;

    flex:0 0 22px;

    border-radius:7px;

    border:1.5px solid var(--muted);

    display:flex;

    align-items:center;
    justify-content:center;

    color:#FFFFFF;

    font-size:15px;
}

.custom-check i {

    opacity:0;
}

.confirm-box.checked .custom-check {

    border-color:var(--primary);

    background:var(--primary);
}

.confirm-box.checked .custom-check i {

    opacity:1;
}

.confirm-text {

    color:var(--secondary);

    font-size:13px;

    line-height:1.55;
}


/* =========================================================
   BOTTOM ACTIONS
========================================================= */

.bottom-actions {

    width:100%;

    max-width:430px;

    margin:18px auto 0;

    display:flex;

    flex-direction:column;

    gap:10px;
}


/* =========================================================
   PRIMARY BUTTON
========================================================= */

.next-button {

    width:100%;

    min-height:42px;

    height:42px;

    padding:0 18px;

    border:0;

    border-radius:30px;

    background:#2979FF;

    color:#FFFFFF;

    font-size:14px;

    font-weight:600;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    cursor:pointer;

    outline:none;

    box-shadow:none;

    -webkit-appearance:none;

    appearance:none;

    overflow:hidden;

    -webkit-tap-highlight-color:transparent;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.next-button:hover {

    opacity:.88;

    transform:translateY(-1px);
}

.next-button:active {

    transform:scale(.985);
}

.next-button:focus,
.next-button:focus-visible,
.next-button:active {

    outline:none;

    box-shadow:none;
}

.next-button:disabled {

    cursor:not-allowed;
}


/* =========================================================
   GO TO LAST FIELD BUTTON
========================================================= */

.last-field-button {

    width:100%;

    min-height:42px;

    height:42px;

    padding:0 18px;

    border:1px solid var(--border);

    border-radius:30px;

    background:var(--surface);

    color:var(--text);

    font-size:13px;

    font-weight:600;

    display:none;

    align-items:center;

    justify-content:center;

    gap:8px;

    cursor:pointer;

    outline:none;

    box-shadow:none;

    -webkit-appearance:none;

    appearance:none;

    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
}

.last-field-button i {

    font-size:18px;

    color:var(--primary);
}

.last-field-button:hover {

    background:var(--surface-secondary);

    transform:translateY(-1px);
}

.last-field-button:active {

    transform:scale(.985);
}

.last-field-button:focus,
.last-field-button:focus-visible {

    outline:none;

    box-shadow:none;
}


/* =========================================================
   BUTTON TEXT
========================================================= */

#nextText {

    display:block;

    line-height:1;

    position:relative;

    z-index:2;
}


/* =========================================================
   LOADER
========================================================= */

.button-loader {

    display:none;

    width:26px;

    height:26px;

    position:relative;

    flex:0 0 26px;

    z-index:3;
}

.button-loader svg {

    width:26px;

    height:26px;

    display:block;

    overflow:visible;

    transform-origin:50% 50%;
}

.button-loader-track {

    fill:none;

    stroke:rgba(255,255,255,.28);

    stroke-width:2;
}

.button-loader-progress {

    fill:none;

    stroke:#FFFFFF;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;

    stroke-dasharray:8 70.54;

    stroke-dashoffset:0;

    transform-origin:50% 50%;

    transform:rotate(-90deg);
}

.button-loader svg.animate {

    animation:
        telegramRotate
        2s
        linear
        infinite;
}

.button-loader-progress.animate {

    animation:
        telegramArc
        1.15s
        cubic-bezier(.4,0,.2,1)
        infinite;
}

.next-button.loading {

    pointer-events:none;

    opacity:1;

    transform:none;
}

.next-button.loading #nextText {

    display:none;
}

.next-button.loading .button-loader {

    display:block;
}

@keyframes telegramRotate {

    0% {
        transform:rotate(0deg);
    }

    100% {
        transform:rotate(360deg);
    }
}

@keyframes telegramArc {

    0% {
        stroke-dasharray:7 62.12;
        stroke-dashoffset:0;
    }

    20% {
        stroke-dasharray:18 51.12;
        stroke-dashoffset:-2;
    }

    40% {
        stroke-dasharray:36 33.12;
        stroke-dashoffset:-8;
    }

    55% {
        stroke-dasharray:47 22.12;
        stroke-dashoffset:-17;
    }

    70% {
        stroke-dasharray:32 37.12;
        stroke-dashoffset:-34;
    }

    85% {
        stroke-dasharray:16 53.12;
        stroke-dashoffset:-48;
    }

    100% {
        stroke-dasharray:7 62.12;
        stroke-dashoffset:-69.12;
    }
}


/* =========================================================
   REVIEW
========================================================= */

.review-card {

    border:1px solid var(--border);

    background:var(--surface-secondary);

    border-radius:18px;

    overflow:hidden;
}

.review-row {

    padding:13px 15px;

    border-bottom:1px solid var(--border);
}

.review-row:last-child {

    border-bottom:0;
}

.review-label {

    font-size:11px;

    color:var(--muted);

    margin-bottom:4px;

    text-transform:uppercase;

    letter-spacing:.5px;

    font-weight:600;
}

.review-value {

    font-size:14px;

    color:var(--text);

    line-height:1.45;

    word-break:break-word;
}

.info-card {

    margin-top:16px;

    padding:14px;

    border-radius:16px;

    background:var(--surface-secondary);

    border:1px solid var(--border);

    display:flex;

    gap:10px;

    align-items:flex-start;
}

.info-card i {

    color:var(--primary);

    font-size:19px;
}

.info-card span {

    color:var(--secondary);

    font-size:12px;

    line-height:1.55;
}


/* =========================================================
   SUCCESS
========================================================= */

.success {

    text-align:center;

    padding-top:35px;
}

.success-icon {

    width:86px;
    height:86px;

    margin:0 auto 24px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--primary);

    background:var(--primary-soft);

    font-size:44px;
}

.success h2 {

    margin:0 0 10px;

    font-size:25px;
}

.success p {

    margin:0;

    color:var(--secondary);

    font-size:14px;

    line-height:1.65;
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width:701px) {

    .toolbar {

        height:68px;

        padding:0 24px;
    }

    .page {

        max-width:900px;

        padding:
            34px
            32px
            50px;
    }

    .progress-area {

        max-width:560px;

        margin-bottom:34px;
    }

    .step-viewport {

        max-width:560px;
    }

    .bottom-actions {

        max-width:560px;

        margin-top:26px;
    }

    .step-title {

        font-size:28px;
    }

    .question-label {

        font-size:22px;
    }

    .form-input {

        min-height:56px;
    }

    .next-button,
    .last-field-button {

        min-height:42px;

        height:42px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px) {

    .toolbar {

        height:62px;

        padding:0 14px;
    }

    .brand {

        font-size:21px;
    }

    .page {

        max-width:430px;

        padding:
            24px
            14px
            30px;
    }

    .progress-area {

        margin-bottom:28px;
    }

    .step-viewport {

        max-width:430px;
    }

    .bottom-actions {

        max-width:430px;
    }

    .step-title {

        font-size:25px;
    }
}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width:400px) {

    .page {

        padding-left:16px;

        padding-right:16px;
    }

    .step-title {

        font-size:23px;
    }

    .question-label {

        font-size:19px;
    }

    .button-loader {

        width:26px;

        height:26px;

        flex-basis:26px;
    }

    .button-loader svg {

        width:26px;

        height:26px;
    }
}

</style>

</head>


<body>


<header class="toolbar">

    <div class="toolbar-left">

        <button
            class="icon-btn"
            id="toolbarBack"
            type="button"
            onclick="previousStep()"
            aria-label="Back"
        >

            <i class="ph ph-arrow-left"></i>

        </button>


        <div class="brand">
            Appnetick.
        </div>

    </div>


    <div class="toolbar-actions">

        <button
            class="icon-btn"
            id="themeButton"
            type="button"
            aria-label="Change theme"
        >

            <i class="ph ph-moon"></i>

        </button>


        <button
            class="icon-btn"
            type="button"
            onclick="goHome()"
            aria-label="Home"
        >

            <i class="ph ph-house"></i>

        </button>

    </div>

</header>


<main class="page">


    <div class="progress-area">

        <div class="progress-top">

            <span
                class="progress-label"
                id="progressLabel"
            >
                Verification
            </span>


            <span
                class="progress-number"
                id="progressNumber"
            >
                1 of 21
            </span>

        </div>


        <div class="progress-track">

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>

    </div>


    <div
        class="step-viewport"
        id="stepViewport"
    ></div>


    <div
        class="bottom-actions"
        id="bottomActions"
    >

        <button
            class="next-button"
            id="nextButton"
            type="button"
            onclick="nextStep()"
        >

            <span id="nextText">
                Get started
            </span>


            <div
                class="button-loader"
                id="buttonLoader"
            >

                <svg
                    viewBox="0 0 26 26"
                    aria-hidden="true"
                >

                    <circle
                        class="button-loader-track"
                        cx="13"
                        cy="13"
                        r="11"
                    ></circle>


                    <circle
                        class="button-loader-progress"
                        id="buttonLoaderProgress"
                        cx="13"
                        cy="13"
                        r="11"
                    ></circle>

                </svg>

            </div>

        </button>


        <button
            class="last-field-button"
            id="lastFieldButton"
            type="button"
            onclick="goToLastField()"
        >

            <i class="ph ph-arrow-up-right"></i>

            <span id="lastFieldButtonText">
                Go to last field
            </span>

        </button>

    </div>

</main>


<script>

/* =========================================================
   API
========================================================= */

const API_BASE =
    "https://api-appnetick.vercel.app";


/* =========================================================
   THEME
========================================================= */

const themeButton =
    document.getElementById("themeButton");

const themeIcon =
    themeButton.querySelector("i");

const systemDark =
    window.matchMedia &&
    window.matchMedia(
        "(prefers-color-scheme: dark)"
    ).matches;

let savedTheme =
    localStorage.getItem(
        "appnetick-theme"
    );

if (!savedTheme) {

    savedTheme =
        systemDark
            ? "dark"
            : "light";
}

applyTheme(savedTheme);


function applyTheme(theme) {

    document.documentElement
        .setAttribute(
            "data-theme",
            theme
        );

    localStorage.setItem(
        "appnetick-theme",
        theme
    );

    themeIcon.className =
        theme === "dark"
            ? "ph ph-sun"
            : "ph ph-moon";
}


themeButton.addEventListener(
    "click",
    function() {

        const current =
            document.documentElement
                .getAttribute(
                    "data-theme"
                );

        applyTheme(
            current === "dark"
                ? "light"
                : "dark"
        );

    }
);


/* =========================================================
   FORM DATA
========================================================= */

const formData = {

    username:"",

    fullName:"",

    legalName:"",
    dateOfBirth:"",

    country:"",
    phone:"",

    accountCategory:"",
    profession:"",

    verificationReason:"",
    knownFor:"",

    website:"",
    socialProfile:"",

    audience:"",
    contentCategory:"",

    achievement:"",
    publicPresence:"",

    authenticityConfirmed:false,
    informationConfirmed:false,
    termsConfirmed:false,

    email:""
};


/* =========================================================
   STEPS
========================================================= */

const steps = [

    /* 1 */

    {
        type:"intro"
    },


    /* 2 */

    {
        type:"input",
        key:"username",
        title:"What is your Appnetick username?",
        help:"Enter the username of the Appnetick account you want to verify. This username is used only to identify and link this application to the correct Appnetick account.",
        placeholder:"Enter your Appnetick username"
    },


    /* 3 */

    {
        type:"input",
        key:"legalName",
        title:"What is your legal name?",
        help:"Enter your full legal name exactly as it appears on your official records.",
        placeholder:"Enter your legal name"
    },


    /* 4 */

    {
        type:"date",
        key:"dateOfBirth",
        title:"What is your date of birth?",
        help:"Your date of birth helps us establish that the account belongs to a real person."
    },


    /* 5 */

/* =========================================================
   LAST FIELD MEMORY
========================================================= */

/*
 * This remembers the last actual application field
 * the user reached.
 *
 * Intro and Review are not stored as the last field.
 */

let lastReachedField = 1;


/*
 * Keep this value during the current page session.
 *
 * If the user reaches username -> legal name -> phone,
 * then goes back to username, the button can take them
 * directly to phone again.
 */

function updateLastReachedField() {

    if (currentStep <= 0) return;

    if (
        currentStep >=
        steps.length - 1
    ) {

        return;
    }

    lastReachedField =
        currentStep;
}


function getLastFieldLabel() {

    if (
        lastReachedField <= 0 ||
        lastReachedField >= steps.length - 1
    ) {

        return "last field";
    }

    const step =
        steps[lastReachedField];

    if (
        step &&
        step.title
    ) {

        return step.title;
    }

    return "last field";
}

/* =========================================================
   RENDER
========================================================= */

function renderStep(
    direction="next",
    animate=false
) {

    const step =
        steps[currentStep];

    const element =
        document.createElement("div");

    element.className =
        "step";

    element.innerHTML =
        getStepHTML(step);

    if (animate) {

        element.classList.add(

            direction === "next"
                ? "slide-next-enter"
                : "slide-back-enter"
        );
    }

    viewport.replaceChildren(
        element
    );

    restoreFieldValue();

    updateProgress();

    updateButtons();

    updateToolbar();

    updateLastFieldButton();
}

/* =========================================================

========================================================= */

function selectChip(element) {

    document
        .querySelectorAll(".chip")
        .forEach(
            chip =>
                chip.classList.remove(
                    "selected"
                )
        );


    element.classList.add(
        "selected"
    );


    formData[
        steps[currentStep].key
    ] =
        element.dataset.value;


    updateButtons();
}


/* =========================================================
   CONFIRM
========================================================= */

function toggleConfirm() {

    const box =
        document.getElementById(
            "confirmBox"
        );

    if (!box) return;


    const key =
        steps[currentStep].key;


    formData[key] =
        !formData[key];


    box.classList.toggle(
        "checked",
        formData[key]
    );


    updateButtons();
}


/* =========================================================
   SAVE CURRENT VALUE
========================================================= */

function saveCurrentValue() {

    const step =
        steps[currentStep];


    if (
        step.type === "input" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        const input =
            document.getElementById(
                "currentInput"
            );


        if (input) {

            formData[step.key] =
                input.value.trim();
        }
    }
}


/* =========================================================
   RESTORE
========================================================= */

function restoreFieldValue() {

    const step =
        steps[currentStep];


    if (
        step.type === "input" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        const input =
            document.getElementById(
                "currentInput"
            );


        if (input) {

            input.value =
                formData[step.key] || "";
        }
    }


    if (step.type === "chips") {

        const selected =
            formData[step.key];


        if (!selected) return;


        document
            .querySelectorAll(".chip")
            .forEach(
                chip => {

                    if (
                        chip.dataset.value ===
                        selected
                    ) {

                        chip.classList.add(
                            "selected"
                        );
                    }

                }
            );
    }


    if (step.type === "confirm") {

        const box =
            document.getElementById(
                "confirmBox"
            );


        if (
            box &&
            formData[step.key]
        ) {

            box.classList.add(
                "checked"
            );
        }
    }
}


/* =========================================================
   VALIDATION
========================================================= */

function validateCurrentStep() {

    const step =
        steps[currentStep];


    if (step.type === "intro") {

        return true;
    }


    if (
        step.type === "input" ||
        step.type === "date" ||
        step.type === "textarea"
    ) {

        saveCurrentValue();


        if (
            !formData[step.key] &&
            !step.optional
        ) {

            showError(
                "Please enter this information before continuing."
            );

            return false;
        }


        /* -----------------------------------------------
           USERNAME
        ------------------------------------------------ */

        if (step.key === "username") {

            let username =
                String(
                    formData.username || ""
                )
                .trim()
                .toLowerCase();


            if (
                username.startsWith("@")
            ) {

                username =
                    username.substring(1);
            }


            const usernamePattern =
                /^[a-z0-9._]{3,50}$/;


            if (
                !usernamePattern.test(
                    username
                )
            ) {

                showError(
                    "Please enter a valid Appnetick username."
                );

                return false;
            }


            formData.username =
                username;
        }


        /* -----------------------------------------------
           EMAIL
        ------------------------------------------------ */

        if (step.key === "email") {

            const email =
                String(
                    formData.email || ""
                )
                .trim()
                .toLowerCase();


            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (
                !emailPattern.test(
                    email
                )
            ) {

                showError(
                    "Please enter a valid email address."
                );

                return false;
            }


            formData.email =
                email;
        }
    }


    if (step.type === "chips") {

        if (!formData[step.key]) {

            showError(
                "Please select one option to continue."
            );

            return false;
        }
    }


    if (step.type === "confirm") {

        if (!formData[step.key]) {

            showError(
                "Please confirm this before continuing."
            );

            return false;
        }
    }


    return true;
}


/* =========================================================
   BUTTON LOADER
========================================================= */

function startButtonProgress() {

    return new Promise(
        resolve => {

            nextButton.classList.add(
                "loading"
            );

            nextButton.disabled =
                true;


            buttonLoaderSvg
                .classList.remove(
                    "animate"
                );

            buttonLoaderProgress
                .classList.remove(
                    "animate"
                );


            void buttonLoaderSvg.offsetWidth;

            void buttonLoaderProgress.offsetWidth;


            buttonLoaderSvg
                .classList.add(
                    "animate"
                );

            buttonLoaderProgress
                .classList.add(
                    "animate"
                );


            setTimeout(
                () => {

                    nextButton.classList.remove(
                        "loading"
                    );


                    buttonLoaderSvg
                        .classList.remove(
                            "animate"
                        );


                    buttonLoaderProgress
                        .classList.remove(
                            "animate"
                        );


                    nextButton.disabled =
                        false;


                    resolve();

                },
                3000
            );

        }
    );
}


/* =========================================================
   NEXT
========================================================= */

async function nextStep() {

    if (isAnimating) return;

    if (isSubmitting) return;


    if (!validateCurrentStep()) {

        return;
    }


    /*
     * Final review submit.
     */

    if (
        currentStep >=
        steps.length - 1
    ) {

        await submitVerification();

        return;
    }


    isAnimating =
        true;


    saveCurrentValue();


    /*
     * Remember this field as the latest
     * field reached by the user.
     */

    updateLastReachedField();


    await startButtonProgress();


    currentStep++;


    /*
     * If we moved to the review page,
     * don't change lastReachedField.
     *
     * Otherwise remember the new field.
     */

    if (
        currentStep <
        steps.length - 1
    ) {

        updateLastReachedField();
    }


    renderStep(
        "next",
        true
    );


    setTimeout(
        () => {

            isAnimating =
                false;

        },
        320
    );


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });
}


/* =========================================================
   PREVIOUS
========================================================= */

function previousStep() {

    if (isAnimating) return;

    if (isSubmitting) return;


    if (currentStep <= 0) {

        goHome();

        return;
    }


    saveCurrentValue();


    isAnimating =
        true;


    currentStep--;


    renderStep(
        "back",
        true
    );


    setTimeout(
        () => {

            isAnimating =
                false;

        },
        320
    );


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });
}


/* =========================================================
   GO TO LAST FIELD
========================================================= */

function goToLastField() {

    if (isAnimating) return;

    if (isSubmitting) return;


    if (
        lastReachedField <= 0 ||
        lastReachedField >= steps.length - 1
    ) {

        return;
    }


    /*
     * Save the field currently being edited
     * before jumping.
     */

    saveCurrentValue();


    if (
        currentStep ===
        lastReachedField
    ) {

        return;
    }


    const direction =
        lastReachedField >
        currentStep
            ? "next"
            : "back";


    isAnimating =
        true;


    currentStep =
        lastReachedField;


    renderStep(
        direction,
        true
    );


    setTimeout(
        () => {

            isAnimating =
                false;

        },
        320
    );


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });
}


/* =========================================================
   LAST FIELD BUTTON
========================================================= */

function updateLastFieldButton() {

    if (!lastFieldButton) return;


    /*
     * Don't show on intro.
     */

    if (currentStep <= 0) {

        lastFieldButton.style.display =
            "none";

        return;
    }


    /*
     * Don't show on review.
     *
     * On review, user is already at the
     * final stage.
     */

    if (
        currentStep >=
        steps.length - 1
    ) {

        lastFieldButton.style.display =
            "none";

        return;
    }


    /*
     * Only show when there is a useful
     * previously reached field ahead/behind.
     */

    if (
        lastReachedField > 0 &&
        lastReachedField !== currentStep
    ) {

        lastFieldButton.style.display =
            "flex";


        lastFieldButtonText.textContent =
            "Go to " +
            getLastFieldShortLabel();

    } else {

        lastFieldButton.style.display =
            "none";
    }
}

========================================================= */

/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const total =
        steps.length;


    const number =
        currentStep + 1;


    const percentage =
        (number / total) * 100;


    progressNumber.textContent =
        `${number} of ${total}`;


    progressFill.style.width =
        `${percentage}%`;


    if (currentStep === 0) {

        progressLabel.textContent =
            "Verification";

    } else if (
        currentStep === total - 1
    ) {

        progressLabel.textContent =
            "Review";

    } else if (
        steps[currentStep].key === "username"
    ) {

        progressLabel.textContent =
            "Account";

    } else if (
        steps[currentStep].key === "email"
    ) {

        progressLabel.textContent =
            "Contact";

    } else {

        progressLabel.textContent =
            "Application";
    }
}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons() {

    nextButton.style.display =
        "flex";


    nextButton.disabled =
        false;


    nextButton.classList.remove(
        "loading"
    );


    buttonLoaderSvg
        .classList.remove(
            "animate"
        );


    buttonLoaderProgress
        .classList.remove(
            "animate"
        );


    if (currentStep === 0) {

        nextText.textContent =
            "Get started";

        return;
    }


    if (
        currentStep ===
        steps.length - 1
    ) {

        nextText.textContent =
            "Submit application";

        return;
    }


    nextText.textContent =
        "Continue";
}

                verification application. The verification
                request, status code and future private
                verification key will be linked to that
                account.

            </span>

        </div>


        <div class="info-card">

            <i class="ph ph-envelope-simple"></i>

            <span>

                After submitting your application, Appnetick
                will send a confirmation email containing
                your private 12-digit status code. Keep this
                code safe because it will be used later to
                check the status of this verification request.

            </span>

        </div>


        <div class="info-card">

            <i class="ph ph-shield-check"></i>

            <span>

                If your application is approved, Appnetick
                will send a separate 18-digit private
                verification key. That key will be linked to
                the Appnetick account identified by your
                username and will be required to activate
                the verification badge.

            </span>

        </div>

    `;
}


/* =========================================================
   REVIEW ROW
========================================================= */

function reviewRow(
    label,
    value
) {

    return `

        <div class="review-row">

            <div class="review-label">

                ${escapeHTML(label)}

            </div>


            <div class="review-value">

                ${escapeHTML(
                    value ||
                    "Not provided"
                )}

            </div>

        </div>

    `;
}


/* =========================================================
   SUBMIT
========================================================= */

        
            
async function submitVerification() {

    if (isSubmitting) return;
    if (isAnimating) return;

    saveCurrentValue();

    if (
        !formData.username ||
        !formData.legalName ||
        !formData.dateOfBirth ||
        !formData.country ||
        !formData.phone ||
        !formData.accountCategory ||
        !formData.profession ||
        !formData.verificationReason ||
        !formData.knownFor ||
        !formData.socialProfile ||
        !formData.audience ||
        !formData.contentCategory ||
        !formData.achievement ||
        !formData.publicPresence ||
        !formData.authenticityConfirmed ||
        !formData.informationConfirmed ||
        !formData.termsConfirmed ||
        !formData.email
    ) {

        showError(
            "Please complete all required information before submitting."
        );

        return;
    }

    formData.username =
        String(formData.username || "")
            .trim()
            .replace(/^@/, "")
            .toLowerCase();

    formData.email =
        String(formData.email || "")
            .trim()
            .toLowerCase();

    isSubmitting = true;

    nextButton.disabled = true;

    lastFieldButton.style.display = "none";

    nextText.textContent = "Submitting...";

    const payload = {

        username: formData.username,

        legal_name: formData.legalName,

        email: formData.email,

        date_of_birth: formData.dateOfBirth,

        country: formData.country,

        phone: formData.phone,

        account_category: formData.accountCategory,

        profession: formData.profession,

        verification_reason:
            formData.verificationReason,

        known_for:
            formData.knownFor,

        website:
            formData.website,

        social_profile:
            formData.socialProfile,

        audience:
            formData.audience,

        content_category:
            formData.contentCategory,

        achievement:
            formData.achievement,

        public_presence:
            formData.publicPresence,

        authenticity_confirmed:
            formData.authenticityConfirmed,

        information_confirmed:
            formData.informationConfirmed,

        terms_confirmed:
            formData.termsConfirmed
    };


    console.log(
        "VERIFICATION PAYLOAD:",
        payload
    );


    try {

        const url =
            `${API_BASE}/api/verification?action=submit`;

        console.log(
            "VERIFICATION URL:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify(payload)
                }
            );


        console.log(
            "VERIFICATION HTTP STATUS:",
            response.status
        );


        console.log(
            "VERIFICATION OK:",
            response.ok
        );


        const rawResponse =
            await response.text();


        console.log(
            "VERIFICATION RAW RESPONSE:",
            rawResponse
        );


        let data = {};

        if (rawResponse) {

            try {

                data =
                    JSON.parse(rawResponse);

            } catch (jsonError) {

                throw new Error(
                    "Server returned non-JSON response. HTTP " +
                    response.status +
                    ": " +
                    rawResponse.substring(0, 500)
                );
            }
        }


        console.log(
            "VERIFICATION JSON:",
            data
        );


        if (!response.ok) {

            if (
                data.code ===
                "ALREADY_APPROVED"
            ) {

                isSubmitting = false;

                showExistingVerification(
                    "approved"
                );

                return;
            }


            if (
                data.code ===
                "ALREADY_VERIFIED"
            ) {

                isSubmitting = false;

                showExistingVerification(
                    "approved"
                );

                return;
            }


            if (
                data.code ===
                "ALREADY_PENDING"
            ) {

                isSubmitting = false;

                showExistingVerification(
                    "pending"
                );

                return;
            }


            if (
                data.code ===
                "ALREADY_REJECTED"
            ) {

                isSubmitting = false;

                showExistingVerification(
                    "rejected"
                );

                return;
            }


            if (
                data.code ===
                "USERNAME_NOT_FOUND"
            ) {

                throw new Error(
                    "No Appnetick account was found with this username."
                );
            }


            if (
                data.code ===
                "INVALID_USERNAME"
            ) {

                throw new Error(
                    "The Appnetick username is invalid."
                );
            }


            throw new Error(

                data.error ||

                data.message ||

                data.code ||

                `Verification API returned HTTP ${response.status}.`
            );
        }


        /*
         * SUCCESS
         */

        showSuccess(data);


    } catch(error) {

        console.error(
            "Verification submit error:",
            error
        );


        isSubmitting = false;

        nextButton.disabled = false;

        nextText.textContent =
            "Submit application";


        nextButton.classList.remove(
            "loading"
        );


        buttonLoaderSvg
            .classList.remove(
                "animate"
            );


        buttonLoaderProgress
            .classList.remove(
                "animate"
            );


        showError(
            error.message ||
            "Unable to submit verification application."
        );
    }
}

            


/* =========================================================
   EXISTING APPLICATION
========================================================= */

function showExistingVerification(
    status
) {

    document.getElementById(
        "bottomActions"
    ).style.display =
        "none";


    toolbarBack.style.visibility =
        "visible";


    progressLabel.textContent =
        "Verification status";


    progressNumber.textContent =
        "Complete";


    progressFill.style.width =
        "100%";


    let title =
        "Verification already completed";


    let description =
        "This account already has an approved verification application.";


    let icon =
        "ph-seal-check";


    if (status === "pending") {

        title =
            "Application already under review";


        description =
            "A verification application for this account is already being reviewed by Appnetick.";


        icon =
            "ph-hourglass";
    }


    if (status === "rejected") {

        title =
            "Previous application was rejected";


        description =
            "A previous verification application was rejected. You may be able to submit another application after the applicable review period.";


        icon =
            "ph-x-circle";
    }


    viewport.replaceChildren(

        (() => {

            const div =
                document.createElement("div");

            div.className =
                "step";

            div.innerHTML = `

                <div class="success">

                    <div class="success-icon">

                        <i class="ph ${icon}"></i>

                    </div>


                    <h2>

                        ${escapeHTML(title)}

                    </h2>


                    <p>

                        ${escapeHTML(description)}

                    </p>


                    <div class="info-card">

                        <i class="ph ph-envelope-simple"></i>

                        <span>

                            Please check the email address
                            associated with your verification
                            application for any available
                            verification updates.

                        </span>

                    </div>

                </div>

            `;

            return div;

        })()

    );
}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(data) {

    isSubmitting =
        false;


    document.getElementById(
        "bottomActions"
    ).style.display =
        "none";


    toolbarBack.style.visibility =
        "visible";


    progressLabel.textContent =
        "Submitted";


    progressNumber.textContent =
        "Complete";


    progressFill.style.width =
        "100%";


    /*
     * Backend may return:
     *
     * status_code
     * email_sent
     *
     * Never display the status code directly here.
     *
     * It is sent through the email.
     */

    const recipient =
        data.email ||
        formData.email;


    viewport.replaceChildren(

        (() => {

            const div =
                document.createElement("div");


            div.className =
                "step";


            div.innerHTML = `

                <div class="success">

                    <div class="success-icon">

                        <i class="ph ph-check"></i>

                    </div>


                    <h2>

                        Application submitted

                    </h2>


                    <p>

                        Your verification request has been
                        submitted successfully.

                        <br><br>

                        The application has been linked to:

                        <br>

                        <strong>
                            @${escapeHTML(
                                formData.username
                            )}
                        </strong>

                        <br><br>

                        A confirmation email has been sent to:

                        <br>

                        <strong>
                            ${escapeHTML(
                                recipient
                            )}
                        </strong>

                        <br><br>

                        The email contains your private
                        12-digit status code. Keep this code
                        safe because it will be required to
                        check the status of this verification
                        request later.

                        <br><br>

                        If your application is approved,
                        Appnetick will send a separate email
                        containing an 18-digit private
                        verification key.

                    </p>

                </div>

            `;


            return div;

        })()

    );
}


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    let existing =
        document.getElementById(
            "formError"
        );


    if (existing) {

        existing.remove();
    }


    const error =
        document.createElement("div");


    error.id =
        "formError";


    error.style.cssText = `

        margin-top:14px;

        padding:12px 14px;

        border-radius:14px;

        background:rgba(229,57,53,0.10);

        border:1px solid rgba(229,57,53,0.25);

        color:var(--danger);

        font-size:13px;

        line-height:1.45;

    `;


    error.innerHTML = `

        <i class="ph ph-warning-circle"></i>

        ${escapeHTML(message)}

    `;


    viewport
        .firstElementChild
        ?.appendChild(error);


    setTimeout(
        () => {

            if (error.parentNode) {

                error.remove();
            }

        },
        4500
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");
}

   HOME
========================================================= */

function goHome() {

    window.location.href =
        "/";
}

   INITIAL RENDER

renderStep(

);
