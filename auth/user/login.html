<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#0b141a;
    color:#fff;
    min-height:100vh;
}

/* ================= TOOLBAR ================= */

.toolbar{
    position:sticky;
    top:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px 16px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(255,255,255,0.1);

    z-index:1000;
}

.toolbar .title{
    font-weight:700;
    font-size:18px;
}

.toolbar img{
    width:35px;
    height:35px;
    border-radius:50%;
    object-fit:cover;
}

/* ================= MAIN ================= */

.container{
    padding:25px;
    max-width:400px;
    margin:auto;
}

.heading{
    font-size:26px;
    font-weight:700;
    margin-top:20px;
}

.desc{
    color:#aaa;
    margin-top:8px;
    font-size:14px;
    line-height:1.5;
}

/* ================= INPUT ================= */

.input{
    width:100%;
    padding:14px;

    margin-top:18px;

    border:none;
    outline:none;

    border-radius:12px;

    background:#1f2c33;

    color:#fff;

    font-size:15px;
}

.input::placeholder{
    color:#8d999f;
}

/* ================= BUTTON ================= */

button{
    width:100%;
    height:50px;

    padding:14px;

    margin-top:20px;

    border:none;
    border-radius:35px;

    background:#2196f3;

    color:#fff;

    font-weight:700;

    cursor:pointer;

    position:relative;
}

button:disabled{
    opacity:.75;
    cursor:not-allowed;
}

/* ================= BUTTON LOADER ================= */

.buttonLoader{
    width:20px;
    height:20px;

    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;

    border-radius:50%;

    animation:spin .7s linear infinite;

    margin:auto;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= SWITCH ================= */

.switch{
    margin-top:15px;
    text-align:center;
    color:#2196f3;
    cursor:pointer;
}

/* ================= FOOTER ================= */

.footer{
    position:fixed;
    bottom:20px;
    width:100%;

    text-align:center;

    font-size:14px;
}

.footer span{
    color:#2196f3;
    cursor:pointer;
}

/* ================= ERROR ================= */

.error{
    margin-top:12px;

    color:#ff6b6b;

    font-size:13px;

    text-align:center;

    display:none;
}

/* ================= PIN SCREEN ================= */

#pinScreen{
    display:none;
}

.pinTitle{
    font-size:26px;
    font-weight:700;
    margin-top:20px;
}

.pinDesc{
    color:#aaa;
    margin-top:8px;
    font-size:14px;
    line-height:1.5;
}

/* ================= PROFILE ================= */

#profileScreen{
    display:none;
}

.profileContainer{
    max-width:500px;
    margin:auto;
    padding:25px 20px 50px;
}

.profileTop{
    display:flex;
    flex-direction:column;
    align-items:center;

    padding-top:15px;
}

.avatar{
    width:105px;
    height:105px;

    border-radius:50%;

    object-fit:cover;

    background:#1f2c33;

    border:2px solid rgba(255,255,255,.12);
}

.fullName{
    margin-top:15px;

    font-size:22px;
    font-weight:700;
}

.username{
    margin-top:5px;

    color:#2196f3;

    font-size:14px;
}

.profileCard{
    margin-top:25px;

    background:#151f25;

    border-radius:18px;

    overflow:hidden;
}

.profileRow{
    display:flex;
    align-items:center;

    padding:16px;

    border-bottom:1px solid rgba(255,255,255,.07);
}

.profileRow:last-child{
    border-bottom:none;
}

.profileIcon{
    width:42px;
    height:42px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#1f2c33;

    margin-right:14px;
}

.profileIcon svg{
    width:21px;
    height:21px;
}

.profileInfo{
    flex:1;
    min-width:0;
}

.profileLabel{
    color:#8d999f;
    font-size:12px;
}

.profileValue{
    margin-top:3px;

    font-size:14px;

    word-break:break-word;
}

.logout{
    width:100%;

    margin-top:20px;

    background:#1f2c33;
}

/* ================= LIGHT MODE ================= */

@media(prefers-color-scheme:light){

    body{
        background:#fff;
        color:#111;
    }

    .toolbar{
        background:rgba(255,255,255,.75);
        border-bottom:1px solid rgba(0,0,0,.08);
    }

    .desc,
    .pinDesc{
        color:#666;
    }

    .input{
        background:#f1f3f5;
        color:#111;
    }

    .profileCard{
        background:#f7f7f7;
    }

    .profileRow{
        border-bottom:1px solid rgba(0,0,0,.07);
    }

    .profileIcon{
        background:#e9ecef;
    }

}

/* =========================================================
   MD5
   ========================================================= */

function md5(string){

    function rotateLeft(lValue, iShiftBits){
        return (lValue << iShiftBits) |
               (lValue >>> (32 - iShiftBits));
    }

    function addUnsigned(lX, lY){

        const lX4 = lX & 0x40000000;
        const lY4 = lY & 0x40000000;

        const lX8 = lX & 0x80000000;
        const lY8 = lY & 0x80000000;

        const lResult =
            (lX & 0x3FFFFFFF) +
            (lY & 0x3FFFFFFF);

        if(lX4 & lY4){
            return lResult ^ 0x80000000 ^
                   lX8 ^ lY8;
        }

        if(lX4 | lY4){

            if(lResult & 0x40000000){
                return lResult ^ 0xC0000000 ^
                       lX8 ^ lY8;
            }else{
                return lResult ^ 0x40000000 ^
                       lX8 ^ lY8;
            }

        }else{
            return lResult ^ lX8 ^ lY8;
        }
    }

    function F(x,y,z){
        return (x & y) | ((~x) & z);
    }

    function G(x,y,z){
        return (x & z) | (y & (~z));
    }

    function H(x,y,z){
        return x ^ y ^ z;
    }

    function I(x,y,z){
        return y ^ (x | (~z));
    }

    function FF(a,b,c,d,x,s,ac){
        a = addUnsigned(
            a,
            addUnsigned(
                addUnsigned(F(b,c,d),x),
                ac
            )
        );

        return addUnsigned(
            rotateLeft(a,s),
            b
        );
    }

    function GG(a,b,c,d,x,s,ac){
        a = addUnsigned(
            a,
            addUnsigned(
                addUnsigned(G(b,c,d),x),
                ac
            )
        );

        return addUnsigned(
            rotateLeft(a,s),
            b
        );
    }

    function HH(a,b,c,d,x,s,ac){
        a = addUnsigned(
            a,
            addUnsigned(
                addUnsigned(H(b,c,d),x),
                ac
            )
        );

        return addUnsigned(
            rotateLeft(a,s),
            b
        );
    }

    function II(a,b,c,d,x,s,ac){
        a = addUnsigned(
            a,
            addUnsigned(
                addUnsigned(I(b,c,d),x),
                ac
            )
        );

        return addUnsigned(
            rotateLeft(a,s),
            b
        );
    }

    function convertToWordArray(string){

        const lWordCount =
            (((string.length + 8) -
            ((string.length + 8) % 64)) / 64 + 1) * 16;

        const lWordArray =
            Array(lWordCount - 1);

        let lBytePosition = 0;
        let lByteCount = 0;

        while(lByteCount < string.length){

            const lWordCountIndex =
                (lByteCount -
                (lByteCount % 4)) / 4;

            lBytePosition =
                (lByteCount % 4) * 8;

            lWordArray[lWordCountIndex] =
                (lWordArray[lWordCountIndex] || 0) |
                (string.charCodeAt(lByteCount)
                << lBytePosition);

            lByteCount++;
        }

        const lWordCountIndex =
            (lByteCount -
            (lByteCount % 4)) / 4;

        lBytePosition =
            (lByteCount % 4) * 8;

        lWordArray[lWordCountIndex] =
            (lWordArray[lWordCountIndex] || 0) |
            (0x80 << lBytePosition);

        lWordArray[lWordCount - 2] =
            string.length << 3;

        lWordArray[lWordCount - 1] =
            string.length >>> 29;

        return lWordArray;
    }

    function wordToHex(lValue){

        let WordToHexValue = "";
        let WordToHexValueTemp = "";
        let lByte;

        for(let lCount = 0; lCount <= 3; lCount++){

            lByte =
                (lValue >>> (lCount * 8)) & 255;

            WordToHexValueTemp =
                "0" + lByte.toString(16);

            WordToHexValue +=
                WordToHexValueTemp.substr(
                    WordToHexValueTemp.length - 2,
                    2
                );
        }

        return WordToHexValue;
    }

    let x =
        convertToWordArray(string);

    let a = 0x67452301;
    let b = 0xEFCDAB89;
    let c = 0x98BADCFE;
    let d = 0x10325476;

    for(let k = 0; k < x.length; k += 16){

        const BB = b;
        const CC = c;
        const DD = d;

        a=FF(a,b,c,d,x[k+0],7,0xD76AA478);
        d=FF(d,a,b,c,x[k+1],12,0xE8C7B756);

        c=FF(c,d,a,b,x[k+10],17,0xFFFF5BB1);

        a=GG(a,b,c,d,x[k+5],5,0xD62F105D);
        d=GG(d,a,b,c,x[k+10],9,0x02441453);
        c=GG(c,d,a,b,x[k+15],14,0xD8A1E681);

        a=II(a,b,c,d,x[k+8],6,0x6FA87E4F);
        d=II(d,a,b,c,x[k+15],10,0xFE2CE6E0);
        c=II(c,d,a,b,x[k+6],15,0xA3014314);
        b=II(b,c,d,a,x[k+13],21,0x4E0811A1);

        a=addUnsigned(a,AA);
        b=addUnsigned(b,BB);
        c=addUnsigned(c,CC);
        d=addUnsigned(d,DD);
    }

    return (
        wordToHex(a) +
        wordToHex(b) +
        wordToHex(c) +
        wordToHex(d)
    ).toLowerCase();
}


/* =========================================================
   LOGIN
   ========================================================= */

async function startLogin(){

    const username =
        document
        .getElementById("usernameInput")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("passwordInput")
        .value;

    hideLoginError();

    if(!username || !password){

        showLoginError(
            "Enter username and password."
        );

        return;
    }


    setLoginLoading(true);


    try{

        /*
         * UsernameIndex:
         *
         * UsernameIndex/
         *     goruraiii54_:
         *         U3PZYC6UTS8DEO7QZ...
         */

        const usernameSnapshot =
            await db
            .ref("UsernameIndex/" + username)
            .once("value");


        if(!usernameSnapshot.exists()){

            throw new Error(
                "INVALID_LOGIN"
            );
        }


        const uid =
            usernameSnapshot.val();


        if(!uid){

            throw new Error(
                "INVALID_LOGIN"
            );
        }


        /*
         * Get user profile
         */

        const userSnapshot =
            await db
            .ref("Users/" + uid)
            .once("value");


        if(!userSnapshot.exists()){

            throw new Error(
                "INVALID_LOGIN"
            );
        }


        const user =
            userSnapshot.val();


        /*
         * Password is HASHED in Firebase.
         *
         * Hash entered password using
         * same algorithm.
         */

        const enteredHash =
            md5(password);


        const storedHash =
            String(user.password || "")
            .trim()
            .toLowerCase();


        if(
            !storedHash ||
            enteredHash !== storedHash
        ){

            throw new Error(
                "INVALID_LOGIN"
            );
        }


        /*
         * Login successful.
         *
         * Save temporary user data.
         */

        currentUser = {
            uid: uid,
            data: user
        };


        /*
         * Small loading delay
         * as requested.
         */

        await new Promise(
            resolve =>
                setTimeout(resolve, 700)
        );


        setLoginLoading(false);

        showPINScreen();


    }catch(error){

        console.error(
            "Login error:",
            error
        );

        setLoginLoading(false);

        if(
            error.message ===
            "INVALID_LOGIN"
        ){

            showLoginError(
                "Username or password is incorrect."
            );

        }else{

            showLoginError(
                "Unable to connect. Please try again."
            );
        }
    }
}


/* =========================================================
   PIN SCREEN
   ========================================================= */

function showPINScreen(){

    document
        .getElementById("loginScreen")
        .style.display = "none";


    document
        .getElementById("pinScreen")
        .style.display = "block";


    document
        .getElementById("pinInput")
        .focus();
}


/* =========================================================
   VERIFY PIN
   ========================================================= */

async function verifyPIN(){

    if(!currentUser){

        return;
    }


    const pin =
        document
        .getElementById("pinInput")
        .value
        .trim();


    const error =
        document
        .getElementById("pinError");


    error.style.display = "none";


    if(!pin){

        error.textContent =
            "Enter your PIN.";

        error.style.display =
            "block";

        return;
    }


    setPINLoading(true);


    try{

        /*
         * Re-read profile so that
         * latest PIN is used.
         */

        const snapshot =
            await db
            .ref(
                "Users/" +
                currentUser.uid
            )
            .once("value");


        const user =
            snapshot.val();


        if(!user){

            throw new Error(
                "USER_NOT_FOUND"
            );
        }


        /*
         * Your current database has
         * PIN field.
         */

        const storedPIN =
            String(user.pin || "");


        if(
            storedPIN !== pin
        ){

            setPINLoading(false);

            error.textContent =
                "Incorrect PIN.";

            error.style.display =
                "block";

            return;
        }


        currentUser.data =
            user;


        /*
         * Give button a small loading
         * moment before profile.
         */

        await new Promise(
            resolve =>
                setTimeout(resolve, 500)
        );


        setPINLoading(false);

        showProfile(user);


    }catch(error){

        console.error(
            "PIN error:",
            error
        );

        setPINLoading(false);

        document
            .getElementById("pinError")
            .textContent =
            "Unable to verify PIN.";

        document
            .getElementById("pinError")
            .style.display =
            "block";
    }
}

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(timestamp){

    if(!timestamp){

        return "Not available";
    }


    const date =
        new Date(
            Number(timestamp)
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Not available";
    }


    return date.toLocaleDateString(
        undefined,
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}
