<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Appnetick - Sign Up</title>

<link rel="icon"
      href="/20260313_121958.jpg">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<!-- PHOSPHOR ICONS -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}


/* =========================================================
   THEME
========================================================= */

:root{

    --bg:#ffffff;
    --surface:#f5f5f5;
    --surface-2:#eeeeee;

    --text:#212121;
    --secondary:#757575;
    --border:#dddddd;

    --primary:#2196f3;
    --primary-text:#ffffff;

    --error-bg:rgba(244,67,54,.10);
    --error-text:#d32f2f;

    --toolbar-bg:rgba(255,255,255,.88);

}


@media (prefers-color-scheme:dark){

    :root{

        --bg:#121212;
        --surface:#1e1e1e;
        --surface-2:#252525;

        --text:#ffffff;
        --secondary:#a0a0a0;
        --border:#424242;

        --primary:#2979ff;
        --primary-text:#ffffff;

        --error-bg:rgba(244,67,54,.14);
        --error-text:#ff8a80;

        --toolbar-bg:rgba(30,30,30,.88);

    }

}


/* =========================================================
   BODY
========================================================= */

body{

    background:var(--bg);

    color:var(--text);

    min-height:100vh;

    overflow-x:hidden;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

    position:sticky;

    top:0;

    height:60px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 16px;

    background:var(--toolbar-bg);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:1px solid var(--border);

    z-index:1000;

}


.toolbar .title{

    font-size:18px;

    font-weight:700;

    letter-spacing:-0.3px;

}


.toolbar-logo{

    width:35px;
    height:35px;

    border-radius:50%;

    object-fit:cover;

    cursor:pointer;

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{

    width:100%;

    max-width:430px;

    margin:0 auto;

    padding:28px 20px 100px;

}


/* =========================================================
   HEADER
========================================================= */

.page-icon{

    width:56px;
    height:56px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-top:8px;

    border-radius:18px;

    background:var(--surface);

    color:var(--primary);

    font-size:28px;

}


.heading{

    font-size:27px;

    font-weight:700;

    letter-spacing:-0.6px;

    margin-top:22px;

}


.desc{

    color:var(--secondary);

    margin-top:9px;

    font-size:14px;

    line-height:1.55;

}


/* =========================================================
   FORM
========================================================= */

.form{

    margin-top:24px;

}


/* =========================================================
   INPUT GROUP
========================================================= */

.input-group{

    position:relative;

    margin-top:14px;

}


.input-icon{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:var(--secondary);

    font-size:20px;

    pointer-events:none;

}


.input{

    width:100%;

    height:52px;

    padding:0 15px 0 48px;

    border:1px solid var(--border);

    outline:none;

    border-radius:15px;

    background:var(--surface);

    color:var(--text);

    font-size:15px;

    transition:

        border-color .2s ease,

        box-shadow .2s ease,

        background .2s ease;

}


.input::placeholder{

    color:var(--secondary);

}


.input:focus{

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px rgba(33,150,243,.12);

}


/* =========================================================
   PASSWORD
========================================================= */

.password-toggle{

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:none;

    width:auto;

    height:auto;

    padding:4px;

    margin:0;

    color:var(--secondary);

    cursor:pointer;

    font-size:20px;

}


.password-toggle:hover{

    color:var(--text);

}


/* =========================================================
   ERROR
========================================================= */

.error{

    display:none;

    margin-top:14px;

    padding:12px 14px;

    border-radius:12px;

    background:var(--error-bg);

    color:var(--error-text);

    font-size:13px;

    line-height:1.45;

}


/* =========================================================
   SIGNUP BUTTON
========================================================= */

.signup-button{

    width:100%;

    min-height:50px;

    margin-top:20px;

    padding:14px 20px;

    border:none;

    outline:none;

    border-radius:28px;

    background:var(--primary);

    color:var(--primary-text);

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    transition:

        transform .15s ease,

        opacity .2s ease;

}


.signup-button:active{

    transform:scale(.98);

}


.signup-button:disabled{

    opacity:.65;

    cursor:not-allowed;

}


/* =========================================================
   BUTTON LOADER
========================================================= */

.button-loader{

    width:20px;

    height:20px;

    border:2px solid rgba(255,255,255,.35);

    border-top-color:#fff;

    border-radius:50%;

    animation:spin .7s linear infinite;

}


@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   LOGIN SWITCH
========================================================= */

.login-switch{

    margin-top:22px;

    text-align:center;

    color:var(--secondary);

    font-size:14px;

}


.login-switch span{

    color:var(--primary);

    font-weight:600;

    cursor:pointer;

}


/* =========================================================
   TERMS
========================================================= */

.terms{

    margin-top:22px;

    color:var(--secondary);

    text-align:center;

    font-size:12px;

    line-height:1.55;

}


.terms span{

    color:var(--primary);

    cursor:pointer;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    padding:15px 20px;

    text-align:center;

    background:var(--toolbar-bg);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-top:1px solid var(--border);

    color:var(--secondary);

    font-size:12px;

}


/* =========================================================
   SMALL DEVICES
========================================================= */

@media(max-width:360px){

    .container{

        padding-left:16px;
        padding-right:16px;

    }

    .heading{

        font-size:25px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     TOOLBAR
========================================================= -->

<div class="toolbar">

    <div class="title">
        Appnetick
    </div>


    <img
        class="toolbar-logo"
        src="/20260313_121958.jpg"
        alt="Appnetick"
        onclick="location.href='/index.html'"
    >

</div>



<!-- =========================================================
     MAIN
========================================================= -->

<div class="container">


    <!-- PAGE ICON -->

    <div class="page-icon">

        <i class="ph ph-user-plus"></i>

    </div>



    <!-- HEADING -->

    <div class="heading">

        Create a new account

    </div>


    <div class="desc">

        Join Appnetick to connect with people,
        share moments, and experience a powerful
        social platform.

    </div>



    <!-- =====================================================
         FORM
    ====================================================== -->

    <div class="form">


        <!-- FULL NAME -->

        <div class="input-group">

            <i class="ph ph-user input-icon"></i>

            <input
                id="fullName"
                class="input"
                type="text"
                autocomplete="name"
                placeholder="Full name"
            >

        </div>



        <!-- EMAIL -->

        <div class="input-group">

            <i class="ph ph-envelope input-icon"></i>

            <input
                id="email"
                class="input"
                type="email"
                autocomplete="email"
                placeholder="Email address"
            >

        </div>



        <!-- USERNAME -->

        <div class="input-group">

            <i class="ph ph-at input-icon"></i>

            <input
                id="username"
                class="input"
                type="text"
                autocomplete="username"
                placeholder="Username"
            >

        </div>



        <!-- PASSWORD -->

        <div class="input-group">

            <i class="ph ph-lock input-icon"></i>

            <input
                id="password"
                class="input"
                type="password"
                autocomplete="new-password"
                placeholder="Password"
            >


            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword()"
                aria-label="Show password"
            >

                <i
                    id="passwordIcon"
                    class="ph ph-eye"
                ></i>

            </button>

        </div>



        <!-- ERROR -->

        <div
            id="signupError"
            class="error">
        </div>



        <!-- SIGNUP BUTTON -->

        <button
            id="signupButton"
            class="signup-button"
            onclick="startSignup()"
        >

            <span id="signupButtonText">

                Create account

            </span>

        </button>


    </div>



    <!-- LOGIN -->

    <div class="login-switch">

        Already have an account?

        <span
            onclick="location.href='/auth/user/login'"
        >

            Login

        </span>

    </div>



    <!-- TERMS -->

    <div class="terms">

        By creating an account, you agree to
        Appnetick's

        <span>
            Terms
        </span>

        and

        <span>
            Privacy Policy
        </span>.

    </div>


</div>



<!-- =========================================================
     FOOTER
========================================================= -->

<div class="footer">

    © 2026 Appnetick

</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

function togglePassword(){

    const password =
        document.getElementById("password");

    const icon =
        document.getElementById("passwordIcon");


    if(password.type === "password"){

        password.type = "text";

        icon.className =
            "ph ph-eye-slash";

    }else{

        password.type = "password";

        icon.className =
            "ph ph-eye";

    }

}



/* =========================================================
   ERROR
========================================================= */

function showError(message){

    const error =
        document.getElementById("signupError");

    error.textContent =
        message;

    error.style.display =
        "block";

}


function clearError(){

    const error =
        document.getElementById("signupError");

    error.textContent =
        "";

    error.style.display =
        "none";

}



/* =========================================================
   BUTTON LOADING
========================================================= */

function setSignupLoading(loading){

    const button =
        document.getElementById("signupButton");

    const text =
        document.getElementById("signupButtonText");


    if(loading){

        button.disabled =
            true;

        text.style.display =
            "none";


        if(
            !button.querySelector(
                ".button-loader"
            )
        ){

            const loader =
                document.createElement("span");

            loader.className =
                "button-loader";

            button.appendChild(loader);

        }

    }else{

        button.disabled =
            false;

        text.style.display =
            "inline";


        const loader =
            button.querySelector(
                ".button-loader"
            );


        if(loader){

            loader.remove();

        }

    }

}



/* =========================================================
   SIGNUP
========================================================= */

async function startSignup(){

    const fullName =
        document
            .getElementById("fullName")
            .value
            .trim();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    clearError();



    /* =====================================================
       VALIDATION
    ====================================================== */

    if(!fullName){

        showError(
            "Please enter your full name."
        );

        return;

    }


    if(!email){

        showError(
            "Please enter your email address."
        );

        return;

    }


    if(!username){

        showError(
            "Please choose a username."
        );

        return;

    }


    if(!password){

        showError(
            "Please create a password."
        );

        return;

    }


    if(password.length < 6){

        showError(
            "Password must contain at least 6 characters."
        );

        return;

    }



    /* =====================================================
       API
       
       Signup API ko tumhare existing backend
       ke according yahan connect kar sakte hain.
    ====================================================== */

    setSignupLoading(true);


    try{

        /*
         * Existing signup API yahan connect hoga.
         *
         * Example:
         *
         * const response = await fetch(
         *     "https://api.appnetick/api/signup",
         *     {
         *         method:"POST",
         *         headers:{
         *             "Content-Type":
         *                 "application/json"
         *         },
         *         body:JSON.stringify({
         *             fullName,
         *             email,
         *             username,
         *             password
         *         })
         *     }
         * );
         */


        /*
         * TEMPORARY
         * Remove this when API is connected.
         */

        await new Promise(
            resolve =>
                setTimeout(resolve,1000)
        );


        console.log({

            fullName:
                fullName,

            email:
                email,

            username:
                username,

            password:
                password

        });


        /*
         * Yahan tumhara actual signup
         * next-step flow open hoga.
         */


    }catch(error){

        console.error(
            "SIGNUP ERROR:",
            error
        );


        showError(
            error.message ||
            "Unable to create account."
        );


    }finally{

        setSignupLoading(false);

    }

}



/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById("fullName")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                document
                    .getElementById("email")
                    .focus();

            }

        }
    );


document
    .getElementById("email")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                document
                    .getElementById("username")
                    .focus();

            }

        }
    );


document
    .getElementById("username")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                document
                    .getElementById("password")
                    .focus();

            }

        }
    );


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                startSignup();

            }

        }
    );


</script>


</body>

</html>
