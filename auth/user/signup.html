<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Appnetick - Signup</title>

<link rel="icon"
      href="/20260313_121958.jpg">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<!-- Phosphor Icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>


<style>

/* =========================================================
   THEME VARIABLES
========================================================= */

:root{

    --bg:#FFFFFF;

    --surface:#FFFFFF;

    --surface-secondary:#F7F7F7;

    --text:#212121;

    --secondary:#757575;

    --muted:#9E9E9E;

    --border:#DCDCDC;

    --input-bg:#F5F5F5;

    --primary:#2196F3;

    --primary-soft:rgba(33,150,243,0.10);

    --error-bg:rgba(244,67,54,0.10);

    --error-text:#D32F2F;

    --shadow:0 6px 25px rgba(0,0,0,0.06);

}


/* =========================================================
   DARK THEME
========================================================= */

[data-theme="dark"]{

    --bg:#1E1E1E;

    --surface:#1E1E1E;

    --surface-secondary:#252525;

    --text:#FFFFFF;

    --secondary:#A0A0A0;

    --muted:#777777;

    --border:#424242;

    --input-bg:#252525;

    --primary:#2979FF;

    --primary-soft:rgba(41,121,255,0.14);

    --error-bg:rgba(244,67,54,0.12);

    --error-text:#FF8A80;

    --shadow:0 6px 25px rgba(0,0,0,0.28);

}


/* =========================================================
   GLOBAL
========================================================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family:'Inter',sans-serif;

}


html{

    min-height:100%;

    background:var(--bg);

}


body{

    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    overflow-x:hidden;

    transition:

        background .25s ease,

        color .25s ease;

}


button,
input{

    font-family:inherit;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

    position:sticky;

    top:0;

    width:100%;

    height:64px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 14px;

    background:var(--surface);

    border-bottom:1px solid var(--border);

    z-index:1000;

}


.toolbar-left{

    display:flex;

    align-items:center;

    gap:9px;

}


.toolbar-title{

    font-size:21px;

    font-weight:600;

    letter-spacing:-.5px;

}


.toolbar-title span{

    color:var(--primary);

}


.toolbar-actions{

    display:flex;

    align-items:center;

    gap:4px;

}


/* =========================================================
   ICON BUTTON
========================================================= */

.icon-button{

    width:42px;

    height:42px;

    border:none;

    outline:none;

    background:transparent;

    color:var(--text);

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:23px;

    cursor:pointer;

    transition:background .18s ease;

}


.icon-button:hover{

    background:var(--surface-secondary);

}


.icon-button:active{

    transform:scale(.96);

}


/* =========================================================
   MAIN
========================================================= */

.container{

    width:100%;

    max-width:430px;

    margin:0 auto;

    padding:30px 20px 45px;

}


/* =========================================================
   SIGNUP HEADER
========================================================= */

.signup-header{

    text-align:center;

    padding:12px 0 26px;

}


/* =========================================================
   LOGO
========================================================= */

.signup-logo{

    width:68px;

    height:68px;

    border-radius:20px;

    object-fit:cover;

    display:block;

    margin:0 auto 20px;

    box-shadow:var(--shadow);

}


/* =========================================================
   HEADING
========================================================= */

.heading{

    font-size:26px;

    line-height:1.2;

    font-weight:700;

    letter-spacing:-.6px;

}


.desc{

    color:var(--secondary);

    margin:10px auto 0;

    max-width:340px;

    font-size:14px;

    line-height:1.6;

}


/* =========================================================
   FORM
========================================================= */

.form-group{

    position:relative;

    margin-top:14px;

}


.input{

    width:100%;

    min-height:52px;

    padding:0 48px 0 46px;

    border:1px solid var(--border);

    outline:none;

    border-radius:16px;

    background:var(--input-bg);

    color:var(--text);

    font-size:15px;

    transition:

        border .18s ease,

        box-shadow .18s ease,

        background .18s ease;

}


.input::placeholder{

    color:var(--muted);

}


.input:focus{

    border-color:var(--primary);

    box-shadow:

        0 0 0 3px

        var(--primary-soft);

}


/* =========================================================
   INPUT LEADING ICON
========================================================= */

.input-leading{

    position:absolute;

    left:16px;

    top:50%;

    transform:translateY(-50%);

    font-size:21px;

    color:var(--secondary);

    pointer-events:none;

}


/* =========================================================
   INPUT ACTION
========================================================= */

.input-action{

    position:absolute;

    right:8px;

    top:50%;

    transform:translateY(-50%);

    width:38px;

    height:38px;

    border:none;

    outline:none;

    border-radius:50%;

    background:transparent;

    color:var(--secondary);

    font-size:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

}


.input-action:hover{

    background:var(--surface-secondary);

}


/* =========================================================
   ERROR
========================================================= */

.error{

    display:none;

    margin-top:14px;

    padding:13px 14px;

    border-radius:14px;

    background:var(--error-bg);

    color:var(--error-text);

    font-size:13px;

    line-height:1.45;

}


/* =========================================================
   PRIMARY BUTTON
========================================================= */

.primary-button{

    width:100%;

    min-height:50px;

    margin-top:18px;

    border:none;

    outline:none;

    border-radius:30px;

    background:var(--primary);

    color:#FFFFFF;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    transition:

        opacity .18s ease,

        transform .12s ease;

}


.primary-button:hover{

    opacity:.90;

}


.primary-button:active{

    transform:scale(.985);

}


.primary-button:disabled{

    opacity:.65;

    cursor:not-allowed;

}


.primary-button > i{

    font-size:20px;

}


/* =========================================================
   BUTTON LOADER
========================================================= */

.button-loader{

    width:20px;

    height:20px;

    border:2px solid rgba(255,255,255,.35);

    border-top-color:#FFFFFF;

    border-radius:50%;

    animation:spin .7s linear infinite;

}


@keyframes spin{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}


/* =========================================================
   SWITCH
========================================================= */

.switch{

    margin-top:18px;

    text-align:center;

    color:var(--primary);

    cursor:pointer;

    font-size:14px;

    font-weight:500;

    padding:6px;

}


.switch:hover{

    text-decoration:underline;

}


/* =========================================================
   SECURITY INFO
========================================================= */

.security-info{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    margin-top:22px;

    color:var(--secondary);

    font-size:12px;

}


.security-info i{

    font-size:16px;

    color:var(--primary);

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    width:100%;

    padding:18px 20px 25px;

    text-align:center;

    color:var(--secondary);

    font-size:13px;

}


.footer span{

    color:var(--primary);

    cursor:pointer;

    font-weight:500;

}


.footer span:hover{

    text-decoration:underline;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    .toolbar{

        height:60px;

    }


    .toolbar-title{

        font-size:20px;

    }


    .container{

        padding:

            24px

            16px

            35px;

    }


    .signup-header{

        padding-top:8px;

    }


    .heading{

        font-size:25px;

    }

}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media(max-width:350px){

    .signup-logo{

        width:62px;

        height:62px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TOOLBAR
===================================================== -->

<div class="toolbar">


    <div class="toolbar-left">

        <div class="toolbar-title">

            Appnetick<span>.</span>

        </div>

    </div>


    <div class="toolbar-actions">


        <!-- THEME -->

        <button
            class="icon-button"
            id="themeButton"
            aria-label="Change theme">

            <i
                class="ph ph-moon"
                id="themeIcon">
            </i>

        </button>


        <!-- HOME -->

        <button
            class="icon-button"
            aria-label="Home"
            onclick="location.href='/index.html'">

            <i class="ph ph-house"></i>

        </button>

    </div>

</div>



<!-- =====================================================
     SIGNUP
===================================================== -->

<div id="signupScreen">


    <div class="container">


        <!-- =============================================
             HEADER
        ============================================== -->

        <div class="signup-header">


            <!-- LOGO IS ABOVE HEADING -->

            <img
                class="signup-logo"
                src="/20260313_121958.jpg"
                alt="Appnetick">


            <div class="heading">

                Create a new account

            </div>


            <div class="desc">

                Join Appnetick to connect with people,
                share moments, and experience a powerful
                social platform.

            </div>


        </div>



        <!-- =============================================
             FULL NAME
        ============================================== -->

        <div class="form-group">


            <i
                class="ph ph-user input-leading">
            </i>


            <input
                id="fullName"
                class="input"
                type="text"
                autocomplete="name"
                placeholder="Full Name">


        </div>



        <!-- =============================================
             EMAIL
        ============================================== -->

        <div class="form-group">


            <i
                class="ph ph-envelope input-leading">
            </i>


            <input
                id="email"
                class="input"
                type="email"
                autocomplete="email"
                placeholder="Email">


        </div>



        <!-- =============================================
             PASSWORD
        ============================================== -->

        <div class="form-group">


            <i
                class="ph ph-lock input-leading">
            </i>


            <input
                id="password"
                class="input"
                type="password"
                autocomplete="new-password"
                placeholder="Password">


            <button
                type="button"
                class="input-action"
                id="passwordToggle"
                aria-label="Show password">

                <i
                    class="ph ph-eye"
                    id="passwordIcon">
                </i>

            </button>


        </div>



        <!-- =============================================
             CONFIRM PASSWORD
        ============================================== -->

        <div class="form-group">


            <i
                class="ph ph-lock-key input-leading">
            </i>


            <input
                id="confirmPassword"
                class="input"
                type="password"
                autocomplete="new-password"
                placeholder="Confirm Password">


            <button
                type="button"
                class="input-action"
                id="confirmPasswordToggle"
                aria-label="Show password">

                <i
                    class="ph ph-eye"
                    id="confirmPasswordIcon">
                </i>

            </button>


        </div>



        <!-- =============================================
             ERROR
        ============================================== -->

        <div
            id="signupError"
            class="error">
        </div>



        <!-- =============================================
             SIGN UP
        ============================================== -->

        <button
            id="signupButton"
            class="primary-button"
            onclick="startSignup()">


            <i class="ph ph-user-plus"></i>


            <span id="signupButtonText">

                Sign Up

            </span>


        </button>



        <!-- =============================================
             MOBILE
        ============================================== -->

        <div
            class="switch">

            Use mobile instead

        </div>



        <!-- =============================================
             SECURITY
        ============================================== -->

        <div class="security-info">


            <i class="ph ph-shield-check"></i>


            Secure Appnetick account creation


        </div>


    </div>

</div>



<!-- =====================================================
     FOOTER
===================================================== -->

<div class="footer">


    Already have an account?


    <span
        onclick="location.href='/auth/user/login'">

        Login

    </span>


</div>



<!-- =====================================================
     SCRIPT
===================================================== -->

<script>


/* =======================================================
   THEME
======================================================= */

const themeButton =
    document.getElementById(
        "themeButton"
    );


const themeIcon =
    document.getElementById(
        "themeIcon"
    );


const systemTheme =
    window.matchMedia &&
    window.matchMedia(
        "(prefers-color-scheme: dark)"
    ).matches
        ? "dark"
        : "light";


let savedTheme =
    localStorage.getItem(
        "appnetick-theme"
    );


if(!savedTheme){

    savedTheme =
        systemTheme;

}


applyTheme(
    savedTheme
);


function applyTheme(theme){

    document.documentElement
        .setAttribute(
            "data-theme",
            theme
        );


    localStorage.setItem(
        "appnetick-theme",
        theme
    );


    if(theme === "dark"){

        themeIcon.className =
            "ph ph-sun";


        themeButton.setAttribute(
            "aria-label",
            "Switch to light theme"
        );

    }else{

        themeIcon.className =
            "ph ph-moon";


        themeButton.setAttribute(
            "aria-label",
            "Switch to dark theme"
        );

    }

}


themeButton.addEventListener(
    "click",
    function(){

        const current =
            document.documentElement
                .getAttribute(
                    "data-theme"
                );


        applyTheme(
            current === "dark"
                ? "light"
                : "dark"
        );

    }
);


/* =======================================================
   PASSWORD TOGGLE
======================================================= */

function setupPasswordToggle(
    inputId,
    buttonId,
    iconId
){

    const input =
        document.getElementById(
            inputId
        );


    const button =
        document.getElementById(
            buttonId
        );


    const icon =
        document.getElementById(
            iconId
        );


    button.addEventListener(
        "click",
        function(){

            const isPassword =
                input.type === "password";


            input.type =
                isPassword
                    ? "text"
                    : "password";


            icon.className =
                isPassword
                    ? "ph ph-eye-slash"
                    : "ph ph-eye";


            button.setAttribute(
                "aria-label",
                isPassword
                    ? "Hide password"
                    : "Show password"
            );

        }
    );

}


setupPasswordToggle(
    "password",
    "passwordToggle",
    "passwordIcon"
);


setupPasswordToggle(
    "confirmPassword",
    "confirmPasswordToggle",
    "confirmPasswordIcon"
);


/* =======================================================
   ERROR
======================================================= */

function showError(
    id,
    message
){

    const element =
        document.getElementById(
            id
        );


    element.textContent =
        message;


    element.style.display =
        "block";

}


function clearError(id){

    const element =
        document.getElementById(
            id
        );


    element.textContent =
        "";


    element.style.display =
        "none";

}


/* =======================================================
   BUTTON LOADING
======================================================= */

function setButtonLoading(
    buttonId,
    textId,
    loading
){

    const button =
        document.getElementById(
            buttonId
        );


    const text =
        document.getElementById(
            textId
        );


    if(loading){

        button.disabled =
            true;


        text.style.display =
            "none";


        if(
            !button.querySelector(
                ".button-loader"
            )
        ){

            const loader =
                document.createElement(
                    "span"
                );


            loader.className =
                "button-loader";


            button.appendChild(
                loader
            );

        }

    }else{

        button.disabled =
            false;


        text.style.display =
            "inline";


        const loader =
            button.querySelector(
                ".button-loader"
            );


        if(loader){

            loader.remove();

        }

    }

}


/* =======================================================
   SIGNUP
======================================================= */

window.startSignup =
function(){

    const fullName =
        document
            .getElementById(
                "fullName"
            )
            .value
            .trim();


    const email =
        document
            .getElementById(
                "email"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "confirmPassword"
            )
            .value;


    clearError(
        "signupError"
    );


    if(!fullName){

        showError(
            "signupError",
            "Please enter your full name."
        );

        return;

    }


    if(!email){

        showError(
            "signupError",
            "Please enter your email."
        );

        return;

    }


    if(!password){

        showError(
            "signupError",
            "Please enter a password."
        );

        return;

    }


    if(password.length < 6){

        showError(
            "signupError",
            "Password must be at least 6 characters."
        );

        return;

    }


    if(!confirmPassword){

        showError(
            "signupError",
            "Please confirm your password."
        );

        return;

    }


    if(password !== confirmPassword){

        showError(
            "signupError",
            "Passwords do not match."
        );

        return;

    }


    /*
    -------------------------------------------------------
    TEMPORARY
    -------------------------------------------------------
    Replace this section with your Signup API.
    -------------------------------------------------------
    */

    setButtonLoading(
        "signupButton",
        "signupButtonText",
        true
    );


    setTimeout(
        function(){

            setButtonLoading(
                "signupButton",
                "signupButtonText",
                false
            );


            showError(
                "signupError",
                "Signup API is not connected yet."
            );

        },
        800
    );

};


/* =======================================================
   ENTER KEY
======================================================= */

document
    .getElementById(
        "fullName"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                document
                    .getElementById(
                        "email"
                    )
                    .focus();

            }

        }
    );


document
    .getElementById(
        "email"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                document
                    .getElementById(
                        "password"
                    )
                    .focus();

            }

        }
    );


document
    .getElementById(
        "password"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                document
                    .getElementById(
                        "confirmPassword"
                    )
                    .focus();

            }

        }
    );


document
    .getElementById(
        "confirmPassword"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                startSignup();

            }

        }
    );


</script>


</body>

</html>
